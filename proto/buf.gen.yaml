# OpenAPI (Swagger 2.0) from the proto, for `make openapi` (#350).
#
# The plugin is a local binary built from tools/codegen/go.mod (a pinned
# grpc-gateway release), so generation needs no plugin registry and every
# machine produces the same bytes. `make openapi` puts it on PATH, then
# converts the output to the checked-in OpenAPI 3 documents under
# api/openapi/v1/ (tools/codegen/cmd/apispec).
#
# No Go, Python or gRPC stubs are generated: the server speaks HTTP/JSON
# only, and the SDKs (#351) are generated from the OpenAPI documents.
version: v2
plugins:
  - local: protoc-gen-openapiv2
    out: ../build/openapi
    opt:
      # The snake_case names the server reads and writes.
      - json_names_for_fields=false
      # Error responses come from the file-level `responses` option, which
      # reference ErrorResponse; no google.rpc.Status.
      - disable_default_errors=true
      - omit_enum_default_value=true
      # DELETE /v1/admin/tenants/{tenant} takes {"confirm": "<tenant>"}.
      - allow_delete_body=true
      # Deterministic output.
      - disable_service_tags=false

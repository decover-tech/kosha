version: v2
managed:
  enabled: true
plugins:
  # ── Go ──────────────────────────────────────────────────────────────────────
  - local: protoc-gen-go
    out: ../gen/go
    opt: paths=source_relative
  - local: protoc-gen-go-grpc
    out: ../gen/go
    opt: paths=source_relative

  # ── Python gRPC stubs (generated, not hand-written) ─────────────────────────
  - local: protoc-gen-grpc-python
    out: ../gen/python

  # ── OpenAPI spec (for client codegen in other languages) ────────────────────
  - remote: buf.build/grpc-ecosystem/plugins/openapiv2
    out: ../gen/openapi
    opt:
      - allow_merge
      - merge_file_name=kosha

syntax = "proto3";

package kosha.v1;

import "google/protobuf/struct.proto";
import "protoc-gen-openapiv2/options/annotations.proto";

option go_package = "github.com/decover-tech/kosha/proto/kosha/v1;koshav1";
option java_multiple_files = true;
option java_package = "com.decover.kosha.v1";

// The body of every non-2xx JSON response, on every route (ADR-350 §b).
// See docs/api/errors.md for the code table.
message ErrorResponse {
  // Human-readable. Not stable: never parse it.
  string error = 1;
  // The stable machine-readable error code; docs/api/errors.md lists
  // them. Clients treat an unknown code by its HTTP status and
  // `retryable`: codes are added without a new API version.
  string code = 2 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {
    enum: [
      "invalid_argument",
      "invalid_query",
      "unauthenticated",
      "payment_required",
      "permission_denied",
      "namespace_quota_exceeded",
      "doc_quota_exceeded",
      "vector_dims_exceeded",
      "not_found",
      "namespace_not_found",
      "method_not_allowed",
      "request_timeout",
      "already_exists",
      "conflict",
      "write_conflict",
      "legacy_route_disabled",
      "payload_too_large",
      "tenant_qps_exceeded",
      "tenant_concurrency_exceeded",
      "tenant_write_rate_exceeded",
      "tenant_queue_full",
      "overloaded",
      "internal",
      "not_implemented",
      "upstream_error",
      "unavailable"
    ]
  }];
  // Whether the identical request may succeed later; true only when the
  // server did not apply it. A forwarded write whose outcome is unknown
  // (`details.outcome: "unknown"`) says false: retry it only if the
  // operation is idempotent.
  bool retryable = 3;
  // Present exactly when `retryable` is true; the `Retry-After` header
  // carries the same delay in whole seconds.
  optional int64 retry_after_ms = 4 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {
    type: INTEGER
    format: "int64"
  }];
  // Echoes the `X-Request-Id` response header; quote it in bug reports.
  string request_id = 5;
  // Code-specific detail. Keys are only ever added.
  google.protobuf.Struct details = 6;
  // Deprecated alias kept for tenant-limit rejections: the old reason
  // string (equal to `code` for the tenant_* codes).
  string reason = 7 [deprecated = true];
  // Deprecated alias kept for tenant-limit rejections: the limit that was
  // hit.
  optional double limit = 8 [deprecated = true];
}

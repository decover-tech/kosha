// ─── Document model ─────────────────────────────────────────────────────────

message Field {
  string name = 1 [(google.api.field_behavior) = REQUIRED];
  // The value's type, PascalCase: "Text", "Keyword", "Integer", "Float",
  // "Date", "Boolean", "Vector" (value: a JSON array of numbers), or
  // "GeoPoint" (value: "lat,lon", {"lat": .., "lon": ..} or GeoJSON
  // [lon, lat]).
  string field_type = 2 [
    (google.api.field_behavior) = REQUIRED,
    (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {
      enum: [
        "Text",
        "Keyword",
        "Integer",
        "Float",
        "Date",
        "Boolean",
        "Vector",
        "GeoPoint"
      ]
    }
  ];
  // Every value is sent as a string.
  string value = 3 [(google.api.field_behavior) = REQUIRED];
}

message Document {
  string id = 1 [(google.api.field_behavior) = REQUIRED];
  repeated Field fields = 2 [(google.api.field_behavior) = REQUIRED];
}

// ─── Index / replace ────────────────────────────────────────────────────────

message IndexDocumentsRequest {
  string namespace = 1;
  repeated Document documents = 2 [(google.api.field_behavior) = REQUIRED];
}

message ReplaceDocumentsRequest {
  string namespace = 1;
  // Full or partial documents, matched by `id`.
  repeated Document documents = 2 [(google.api.field_behavior) = REQUIRED];
}

message ReplaceDocumentsResponse {
  int64 indexed_count = 1 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {
    type: INTEGER
    format: "int64"
  }];
  string namespace = 2;
}

message IndexDocumentsResponse {
  int64 indexed_count = 1 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {
    type: INTEGER
    format: "int64"
  }];
  string namespace = 2;
}

// ─── Exists ─────────────────────────────────────────────────────────────────

message ExistsRequest {
  string namespace = 1;
  repeated string ids = 2 [(google.api.field_behavior) = REQUIRED];
}

message ExistsResponse {
  string namespace = 1;
  repeated string existing = 2;
  repeated string missing = 3;
}

// ─── Export ─────────────────────────────────────────────────────────────────

message ExportDocumentsRequest {
  string namespace = 1;
  // Documents per page: default 1000, at most 10000.
  optional uint32 limit = 2;
  // The previous page's next_cursor; absent or empty for the first page.
  optional string cursor = 3;
  // "strong" (default) includes acknowledged writes not yet flushed.
  optional string consistency = 4 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {
    enum: [
      "strong",
      "eventual"
    ]
  }];
}

message ExportDocumentsResponse {
  string namespace = 1;
  repeated Document documents = 2;
  // The cursor for the next page; null once this page was the last.
  optional string next_cursor = 3;
}

// ─── Flush ──────────────────────────────────────────────────────────────────

message FlushRequest {
  string namespace = 1;
}

message FlushResponse {
  // "flushed".
  string status = 1;
}

// ─── Delete by query ────────────────────────────────────────────────────────

message DeleteByQueryRequest {
  string namespace = 1;
  // Kosha-native filter (term/terms/range/bool/exists/geo_distance).
  google.protobuf.Struct filter = 2;
  // OpenSearch-style alias of `filter`.
  google.protobuf.Struct query = 3;
}

message DeleteByQueryResponse {
  int64 deleted = 1 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {
    type: INTEGER
    format: "int64"
  }];
  string namespace = 2;
}

// ─── Search ─────────────────────────────────────────────────────────────────

message SearchRequest {
  string namespace = 1;
  // The lexical query; "" for a query with no lexical part (kNN only,
  // filter only, fuzzy).
  string query_text = 2 [(google.api.field_behavior) = REQUIRED];
  // Page size (default 10).
  uint32 max_results = 3;
  // Offset of the page (default 0).
  uint32 from = 4;
  // BM25 overrides.
  optional Bm25Params bm25_params = 5;
  // Kosha-native filter clause (term/terms/range/bool/exists/geo_distance).
  google.protobuf.Struct filter = 6;
  // Sort keys, in order: `[{"date": {"order": "desc"}}, {"_score": {...}}]`.
  repeated google.protobuf.Struct sort = 7;
  // Keyset pagination: the `sort` values of the last hit of the previous
  // page, as strings.
  repeated string search_after = 8;
  // Highlighting (#195): `{"fields": {"title": {}, "body": {"pre_tags":
  // ["<em>"]}}, "pre_tags": [..], "post_tags": [..]}`, or the deprecated
  // single-field `{"field": "title"}`.
  google.protobuf.Struct highlight = 9;
  // Aggregations keyed by name (terms, histogram, date_histogram, range,
  // stats, composite, ...).
  map<string, google.protobuf.Struct> aggs = 10;
  optional WildcardQuery wildcard = 11;
  // Typo-tolerant term matching. A lexical query of its own: not
  // combinable with query_text / fields / wildcard / match_phrase.
  optional FuzzyQuery fuzzy = 12;
  optional MatchPhraseQuery match_phrase = 13;
  // kNN / ANN vector search.
  optional KnnQuery knn = 14;
  // Count every match instead of stopping at `total_hits_cap`.
  optional bool exact_total_hits = 15;
  // Count matches up to this many (default 10,000), then report
  // `total_hits_relation: "gte"`.
  optional uint32 total_hits_cap = 16;
  // How query_text terms combine: "or" (default) or "and".
  optional string operator = 17 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {
    enum: [
      "and",
      "or"
    ]
  }];
  // Bypass the result cache.
  optional bool no_cache = 18;
  // At most one hit per distinct value of a keyword field.
  optional CollapseSpec collapse = 19;
  // At most `max` hits per distinct value of a keyword field, applied while
  // collecting results (the page stays full).
  optional LimitPer limit_per = 20;
  // Return only these stored fields.
  repeated string source_includes = 21;
  // Leave out these stored fields.
  repeated string source_excludes = 22;
  // How a hybrid request fuses its lexical and kNN lists.
  optional Rank rank = 23;
  // "lexical", "semantic" or "hybrid". Unset infers it from the clauses
  // present; a set value is checked against them.
  optional string mode = 24 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {
    enum: [
      "lexical",
      "semantic",
      "hybrid"
    ]
  }];
  // Restrict query_text to these Text fields, each optionally boosted:
  // ["title^2", "content"]. Empty = every Text field; "_all" names that
  // explicitly.
  repeated string fields = 25;
  // Score modifiers: field-value boosts and linear / exp / gauss decays
  // over Integer, Float, Date and GeoPoint fields, applied to the best
  // `window_size` hits. See README "Score modifiers".
  google.protobuf.Struct rank_by = 26;
  // Rerank the top hits (the fused list for a hybrid request) with an
  // external model.
  optional Rerank rerank = 27;
  // Read-your-writes (#255): "strong" also scans the namespace's
  // acknowledged-but-unindexed writes; "eventual" searches indexed segments
  // only. Unset uses the server default (KOSHA_DEFAULT_CONSISTENCY, itself
  // strong).
  optional string consistency = 28 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {
    enum: [
      "strong",
      "eventual"
    ]
  }];
  // Query replicas only (#232): accept a manifest at most this many
  // seconds old instead of checking the control store first.
  optional double max_staleness_seconds = 29;
  // With the dashboard on (#214): add the phase breakdown `timings` to the
  // response.
  optional bool timings = 30;
}

message Bm25Params {
  optional double k1 = 1;
  optional double b = 2;
  // Corpus statistics scope: "namespace" (default) or "segment".
  optional string stats = 3 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {
    enum: [
      "namespace",
      "segment"
    ]
  }];
}

message Rerank {
  // A provider the server has configured.
  string provider = 1 [(google.api.field_behavior) = REQUIRED];
  // Default: the provider's configured model.
  optional string model = 2;
  // Stored field sent as each document's text.
  string field = 3 [(google.api.field_behavior) = REQUIRED];
  // Default from + max_results; >= that, <= 1000.
  optional uint32 top_n = 4;
  // Default 2000, <= 60000.
  optional uint32 timeout_ms = 5;
  // Default query_text, then match_phrase.phrase, then fuzzy.value.
  optional string query = 6;
}

message CollapseSpec {
  string field = 1 [(google.api.field_behavior) = REQUIRED];
}

message LimitPer {
  string field = 1 [(google.api.field_behavior) = REQUIRED];
  // >= 1.
  uint32 max = 2 [(google.api.field_behavior) = REQUIRED];
}

message Rank {
  optional RrfRank rrf = 1;
}

// score(d) = sum over retrievers r of 1 / (rank_constant + rank_r(d)).
message RrfRank {
  // Per-retriever list length and fused list length. Default: max_results;
  // must be >= max_results.
  optional uint32 rank_window_size = 1;
  // Default 60; must be >= 1.
  optional uint32 rank_constant = 2;
}

message FuzzyQuery {
  // "", "_all" or "*" = every Text field.
  string field = 1;
  // Analyzed per segment; each token is expanded.
  string value = 2 [(google.api.field_behavior) = REQUIRED];
  // 0, 1, 2, "auto" (default) or "auto:low,high".
  google.protobuf.Value fuzziness = 3;
  // Leading characters that must match exactly (default 0).
  optional uint32 prefix_length = 4;
  // Terms per token per segment, nearest first (default 50, max 1024).
  optional uint32 max_expansions = 5;
  // An adjacent swap counts as one edit (default true).
  optional bool transpositions = 6;
}

message WildcardQuery {
  string field = 1 [(google.api.field_behavior) = REQUIRED];
  string pattern = 2 [(google.api.field_behavior) = REQUIRED];
  // Default true.
  optional bool case_insensitive = 3;
}

message MatchPhraseQuery {
  // The field the phrase must occur in; "", "_all" or "*" = any one field.
  string field = 1;
  string phrase = 2 [(google.api.field_behavior) = REQUIRED];
  uint32 slop = 3;
  // Several fields, any one of them (overrides field when non-empty).
  repeated string fields = 4;
}

message KnnQuery {
  string field = 1 [(google.api.field_behavior) = REQUIRED];
  // The query vector. Omit it and set `query_text` to have the server
  // embed the text with the field's schema model (#209).
  repeated float vector = 2;
  // Default 10.
  optional uint32 k = 3;
  // Default 100.
  optional uint32 num_candidates = 4;
  google.protobuf.Struct filter = 5;
  // Late-interaction (multi-vector) query vectors: an array of arrays of
  // numbers.
  google.protobuf.Value vectors = 6;
  // "cosine" (default) or "late_interaction".
  optional string scoring = 7 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {
    enum: [
      "cosine",
      "late_interaction"
    ]
  }];
  // Text the server embeds into `vector`.
  optional string query_text = 8;
}

message SearchResponse {
  repeated ScoredDocument results = 1;
  int64 total_hits = 2 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {
    type: INTEGER
    format: "int64"
  }];
  // "eq" when total_hits is exact, "gte" when it is a capped lower bound.
  string total_hits_relation = 3 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {
    enum: [
      "eq",
      "gte"
    ]
  }];
  // Aggregation results keyed by the request's aggregation names.
  google.protobuf.Struct aggregations = 4;
  // kNN requests: segments whose vector search failed and contributed no
  // candidates (0 when every segment searched cleanly).
  optional uint32 knn_degraded_segments = 5;
  // Reranked requests only: true when the provider timed out or failed and
  // results are in first-stage order.
  optional bool rerank_degraded = 6;
  optional string rerank_degraded_reason = 7;
  // Filtered kNN: "ann", "exact" or "mixed".
  optional string knn_mode = 8 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {
    enum: [
      "ann",
      "exact",
      "mixed"
    ]
  }];
  // Filtered kNN: documents that passed the filter.
  optional uint64 knn_filtered_candidates = 9 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {
    type: INTEGER
    format: "int64"
  }];
  // Unindexed documents scanned exhaustively (strong consistency, #255).
  uint64 exhaustive_search_count = 10 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {
    type: INTEGER
    format: "int64"
  }];
  // Set when a "strong" search was answered as "eventual"; says why.
  optional string consistency_fallback = 11;
  // `"timings": true` requests with the dashboard on (#214).
  google.protobuf.Struct timings = 12;
}

message ScoredDocument {
  string doc_id = 1;
  // The fused RRF score for a hybrid request; the rerank score when
  // reranked.
  double score = 2;
  repeated Field fields = 3;
  // Deprecated: set only for the legacy single-field highlight request; use
  // `highlight`.
  repeated string highlights = 4;
  // Hybrid requests only.
  optional RankDetails rank_details = 5;
  // Highlight fragments keyed by field name: arrays of strings.
  map<string, google.protobuf.Value> highlight = 6;
  // Reranked requests only: the first-stage (fused) score, and the
  // provider's score (= score; unset when the rerank degraded).
  optional double fused_score = 7;
  optional double rerank_score = 8;
}

// 1-based ranks in each retriever's namespace-wide list; unset when the hit
// was not in that retriever's window.
message RankDetails {
  optional uint32 lexical_rank = 1;
  optional double lexical_score = 2;
  optional uint32 knn_rank = 3;
  optional double knn_score = 4;
  // rank_by requests: the score before the modifiers.
  optional double base_score = 5;
}

// ─── Stats ──────────────────────────────────────────────────────────────────

message GetStatsRequest {
  string namespace = 1;
}

message GetStatsResponse {
  string namespace = 1;
  int64 documents = 2 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {
    type: INTEGER
    format: "int64"
  }];
  int64 segments = 3 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {
    type: INTEGER
    format: "int64"
  }];
  int64 version = 4 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {
    type: INTEGER
    format: "int64"
  }];
  // Same as `version`.
  int64 manifest_version = 5 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {
    type: INTEGER
    format: "int64"
  }];
  // Writer pods: acknowledged documents not yet in a segment.
  optional int64 unindexed_documents = 6 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {
    type: INTEGER
    format: "int64"
  }];
  optional int64 unindexed_bytes = 7 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {
    type: INTEGER
    format: "int64"
  }];
  // Query replicas (#232): the stored manifest version last seen, when the
  // local manifest was last confirmed current (Unix seconds), and how long
  // ago that was (null if never).
  optional int64 stored_manifest_version = 8 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {
    type: INTEGER
    format: "int64"
  }];
  optional int64 last_refresh_at = 9 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {
    type: INTEGER
    format: "int64"
  }];
  optional double manifest_lag_seconds = 10;
  // Sharded namespaces (#207).
  optional uint32 shards = 11;
  repeated ShardStats shard_stats = 12;
  // Branches (#208).
  optional BranchLineage branch = 13;
  // With the dashboard on (#214).
  repeated google.protobuf.Struct recent_queries = 14;
}

message ShardStats {
  uint32 shard = 1;
  int64 documents = 2 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {
    type: INTEGER
    format: "int64"
  }];
  int64 segments = 3 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {
    type: INTEGER
    format: "int64"
  }];
  int64 manifest_version = 4 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {
    type: INTEGER
    format: "int64"
  }];
}

message BranchLineage {
  string parent = 1;
  int64 parent_version = 2 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {
    type: INTEGER
    format: "int64"
  }];
  int64 shared_segments = 3 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {
    type: INTEGER
    format: "int64"
  }];
}

// ─── Usage and billing (issues #348, #349) ──────────────────────────────────

message GetUsageRequest {
  // Window start, Unix seconds (default: 30 days before `to`).
  optional int64 from = 1 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {
    type: INTEGER
    format: "int64"
  }];
  // Window end, Unix seconds (default: now).
  optional int64 to = 2 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {
    type: INTEGER
    format: "int64"
  }];
}

message GetUsageResponse {
  string tenant = 1;
  int64 from = 2 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {
    type: INTEGER
    format: "int64"
  }];
  int64 to = 3 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {
    type: INTEGER
    format: "int64"
  }];
  // Per-namespace usage counters.
  repeated google.protobuf.Struct namespaces = 4;
  // The counters summed over `namespaces`.
  google.protobuf.Struct total = 5;
}

message GetBillingRequest {}

message GetBillingResponse {
  string tenant = 1;
  string plan = 2;
  string kind = 3;
  // Account standing: "active", "past_due", "suspended", ...
  string state = 4;
  bool free_tier_exceeded = 5;
  // The billing period, "YYYY-MM".
  string period = 6;
  // Month-to-date usage totals.
  google.protobuf.Struct usage = 7;
  // What the month would cost if it ended now: `{lines, total_cents}`.
  google.protobuf.Struct accrued = 8;
  repeated google.protobuf.Struct invoices = 9;
}

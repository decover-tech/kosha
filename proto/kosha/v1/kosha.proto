// ─── Health ──────────────────────────────────────────────────────────────────

message HealthCheckRequest {}

message HealthCheckResponse {
  // "ok".
  string status = 1;
}

// ─── Namespace management ───────────────────────────────────────────────────

message CreateNamespaceRequest {
  string namespace = 1 [(google.api.field_behavior) = REQUIRED];
  optional NamespaceSchema schema = 2;
}

message NamespaceSchema {
  map<string, FieldSchema> fields = 1;
  // Analyzer for Text fields not listed in `fields`. Empty = "standard".
  repeated string default_analyzer = 2;
  // Stopword list for `default_analyzer`'s "stop" filter (built-in English
  // list if empty).
  repeated string default_stopwords = 3;
}

message FieldSchema {
  // The field type. Accepted spellings: the canonical "FIELD_TYPE_TEXT"
  // form the server returns, the bare name in any case ("text",
  // "Keyword"), or the enum number. Types: TEXT, KEYWORD, INTEGER, FLOAT,
  // DATE, BOOLEAN, VECTOR, GEO_POINT.
  string type = 1;
  // Alias of `type`.
  string field_type = 6;
  // Whether the field is full-text indexed.
  bool indexed = 2;
  // Whether the field value is stored and returned.
  bool stored = 3;
  // Analyzer, then token filters. Analyzers: "standard" (legacy tokenizer),
  // "standard@2" (Unicode UAX #29), "keyword", "lowercase", "whitespace".
  // Filters: "lowercase", "stop", "stem" (English Snowball). Empty =
  // "standard".
  repeated string analyzer = 4;
  // Stopword list for this field's "stop" filter (built-in English list if
  // empty).
  repeated string stopwords = 5;
  // Vector fields only (issue #209): the embedding model the server uses to
  // embed `knn.query_text` and text-valued documents for this field.
  google.protobuf.Struct embedding = 7;
}

message CreateNamespaceResponse {
  // The namespace name (tenant-relative).
  string id = 1;
  NamespaceSchema schema = 2;
  int64 document_count = 3 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {
    type: INTEGER
    format: "int64"
  }];
  int64 segment_count = 4 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {
    type: INTEGER
    format: "int64"
  }];
  int64 version = 5 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {
    type: INTEGER
    format: "int64"
  }];
  // Unix timestamp (seconds).
  int64 created_at = 6 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {
    type: INTEGER
    format: "int64"
  }];
}

message ListNamespacesRequest {}

message ListedNamespace {
  string name = 1;
  // Null when this node could not load the namespace's manifest.
  optional int64 documents = 2 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {
    type: INTEGER
    format: "int64"
  }];
  optional int64 segments = 3 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {
    type: INTEGER
    format: "int64"
  }];
  optional int64 manifest_version = 4 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {
    type: INTEGER
    format: "int64"
  }];
}

message ListNamespacesResponse {
  repeated ListedNamespace namespaces = 1;
}

message DeleteNamespaceRequest {
  string namespace = 1;
}

message DeleteNamespaceResponse {
  string namespace = 1;
  bool acknowledged = 2;
  // False when the namespace was deleted but some of its stored objects
  // (local segment files or S3 objects) could not be removed. They are
  // unreferenced and never reused by a re-created namespace.
  bool storage_reclaimed = 3;
  // The durable record of this deletion (#347). `state` is "completed" only
  // when the namespace's storage prefix was deleted and listed empty.
  DeletionRecord deletion = 4;
}

// One hard delete of a namespace or a tenant, as the control store keeps it
// (kosha.deletion_records). Holds identifiers and counters only.
message DeletionRecord {
  string id = 1;
  // "namespace" or "tenant".
  string scope = 2 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {
    enum: [
      "namespace",
      "tenant"
    ]
  }];
  // Internal namespace id ("<tenant>/<name>") or tenant id, per `scope`.
  string subject = 3;
  optional string tenant_id = 4;
  // The tenant deletion a namespace deletion is part of.
  optional string parent_id = 5;
  // Namespace scope: the manifest version the namespace retired at.
  uint64 last_version = 6 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {
    type: INTEGER
    format: "int64"
  }];
  // "pending" (rows gone, stored objects may remain) or "completed".
  string state = 7 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {
    enum: [
      "pending",
      "completed"
    ]
  }];
  // Storage-reclaim attempts so far.
  uint32 attempts = 8;
  // Objects deleted from object storage, summed over the attempts.
  uint64 objects_deleted = 9 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {
    type: INTEGER
    format: "int64"
  }];
  // Why the last attempt did not complete.
  optional string last_error = 10;
  uint64 requested_at_ms = 11 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {
    type: INTEGER
    format: "int64"
  }];
  optional uint64 completed_at_ms = 12 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {
    type: INTEGER
    format: "int64"
  }];
}

message PutNamespaceSchemaRequest {
  string namespace = 1;
  // The schema itself is the request body (`{"fields": {...}}`); a body
  // wrapped as `{"schema": {...}}` is accepted too.
  NamespaceSchema schema = 2;
}

message PutNamespaceSchemaResponse {
  string namespace = 1;
  NamespaceSchema schema = 2;
  // False when the stored schema was already identical.
  bool changed = 3;
}

message GetNamespaceSchemaRequest {
  string namespace = 1;
}

message GetNamespaceSchemaResponse {
  string namespace = 1;
  NamespaceSchema schema = 2;
}

message PutShardsRequest {

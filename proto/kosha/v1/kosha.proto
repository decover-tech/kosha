      }
      extensions: {
        key: "x-stability-level"
        value: {string_value: "stable"}
      }
    };
  }

  // Delete a namespace and its segments. Permanent; a re-created namespace
  // of the same name starts empty.
  rpc DeleteNamespace(DeleteNamespaceRequest) returns (DeleteNamespaceResponse) {
    option (google.api.http) = {delete: "/v1/namespaces/{namespace}"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      responses: {
        key: "429"
        value: {
          description: "overloaded and tenant rate limits; retry after `Retry-After` seconds"
          schema: {json_schema: {ref: ".kosha.v1.ErrorResponse"}}
          headers: {
            key: "Retry-After"
            value: {
              type: "integer"
              description: "Seconds to wait before retrying."
            }
          }
        }
      }
      responses: {
        key: "503"
        value: {
          description: "unavailable; retry after `Retry-After` seconds"

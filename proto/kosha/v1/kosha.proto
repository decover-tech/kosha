      }
      extensions: {
        key: "x-stability-level"
        value: {string_value: "stable"}
      }
    };
  }

  // Index documents: each one is inserted, or replaces the stored document
  // with the same id in full.
  rpc IndexDocuments(IndexDocumentsRequest) returns (IndexDocumentsResponse) {
    option (google.api.http) = {
      post: "/v1/namespaces/{namespace}/documents"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      responses: {

syntax = "proto3";

package kosha.v1;

option go_package = "github.com/decover-tech/kosha/proto/kosha/v1;koshav1";
option java_package = "com.decover.kosha.v1";
option java_multiple_files = true;

import "google/api/annotations.proto";
import "google/protobuf/struct.proto";

// ─── Service ─────────────────────────────────────────────────────────────────
//
// Kosha is a storage-disaggregated search engine with S3 as durable storage
// and local NVMe as a transparent read-through cache (see DESIGN.md §5, §12).
//
// HTTP/JSON is the primary transport; gRPC is the secondary transport for
// internal, latency-sensitive callers.  Both share this service definition.
//
// The HTTP paths use a versioned prefix (/v1/) so the public API can evolve
// independently of internal use.
//
// ── Authentication ──────────────────────────────────────────────────────────
//
// Every request must carry an API key identifying the tenant/client.  The key
// is passed via an HTTP header (or gRPC metadata) and maps to a tenant ID that
// scopes all namespace access:
//
//   Authorization: Bearer <api_key>
//   X-Api-Key: <api_key>              (alternative for serverless/edge)
//
// The server validates the key against its configured KOSHA_API_KEYS and
// extracts a tenant prefix that is prepended to every namespace argument:
//
//   POST /v1/namespaces/my-index/search
//   → tenant "acme-corp" → actual namespace becomes "acme-corp/my-index"
//
// This ensures tenants cannot read or write each other's data even if they
// guess another tenant's namespace name.  See DESIGN.md §10 (Multi-Tenancy).

service KoshaService {
  // Health check — liveness probe for load balancers / K8s.
  rpc HealthCheck(HealthCheckRequest) returns (HealthCheckResponse) {
    option (google.api.http) = { get: "/v1/healthz" };
  }

  // Bulk-index documents into a namespace.
  rpc IndexDocuments(IndexDocumentsRequest) returns (IndexDocumentsResponse) {
    option (google.api.http) = {
      post: "/v1/namespaces/{namespace}/documents"
      body: "*"
    };
  }

  // Search — BM25 lexical (Phase 1) and hybrid lexical + ANN (Phase 2).
  rpc Search(SearchRequest) returns (SearchResponse) {
    option (google.api.http) = {
      post: "/v1/namespaces/{namespace}/search"
      body: "*"
    };
  }

  // Flush buffered documents to a segment, making them queryable.
  rpc Flush(FlushRequest) returns (FlushResponse) {
    option (google.api.http) = {
      post: "/v1/namespaces/{namespace}/flush"
      body: "*"
    };
  }

  // Delete documents matching a filter query (tombstone-based).
  rpc DeleteByQuery(DeleteByQueryRequest) returns (DeleteByQueryResponse) {
    option (google.api.http) = {
      post: "/v1/namespaces/{namespace}/delete"
      body: "*"
    };
  }

  // Get statistics for all namespaces or a specific one.
  rpc GetStats(GetStatsRequest) returns (GetStatsResponse) {
    option (google.api.http) = {
      get: "/v1/stats"
      additional_bindings: { get: "/v1/namespaces/{namespace}/stats" }
    };
  }

  // Create a namespace with an optional schema.
  rpc CreateNamespace(CreateNamespaceRequest) returns (CreateNamespaceResponse) {
    option (google.api.http) = {
      post: "/v1/namespaces"
      body: "*"
    };
  }

  // Set a namespace's schema (issue #220): per-field analyzers for segments
  // written from now on. Existing segments keep the analysis recorded in
  // their footers and stay searchable with it.
  rpc PutNamespaceSchema(PutNamespaceSchemaRequest) returns (PutNamespaceSchemaResponse) {
    option (google.api.http) = {
      post: "/v1/namespaces/{namespace}/schema"
      body: "*"
    };
  }

  rpc GetNamespaceSchema(GetNamespaceSchemaRequest) returns (GetNamespaceSchemaResponse) {
    option (google.api.http) = {
      get: "/v1/namespaces/{namespace}/schema"
    };
  }

  // Delete a namespace and its segments.
  rpc DeleteNamespace(DeleteNamespaceRequest) returns (DeleteNamespaceResponse) {
    option (google.api.http) = {
      delete: "/v1/namespaces/{namespace}"
    };
  }

  // Branch a namespace (issue #208): a new namespace whose manifest lists
  // the parent's segments in place (copy-on-write, no data copied).
  rpc BranchNamespace(BranchNamespaceRequest) returns (BranchNamespaceResponse) {
    option (google.api.http) = {
      post: "/v1/namespaces/{namespace}/branch"
      body: "*"
    };
  }

  rpc ListBranches(ListBranchesRequest) returns (ListBranchesResponse) {
    option (google.api.http) = {
      get: "/v1/namespaces/{namespace}/branches"
    };
  }

  // Delete a branch. Reclaims only objects in the branch's own prefix that
  // no remaining manifest references. Fails (409) for a namespace that is
  // not a branch.
  rpc DeleteBranch(DeleteBranchRequest) returns (DeleteBranchResponse) {
    option (google.api.http) = {
      delete: "/v1/namespaces/{namespace}/branch"
    };
  }
}

// ─── Health ──────────────────────────────────────────────────────────────────

message HealthCheckRequest {}

message HealthCheckResponse {
  string status = 1;  // "ok"
}

// ─── Namespace management ───────────────────────────────────────────────────

message CreateNamespaceRequest {
  string namespace = 1;
  optional NamespaceSchema schema = 2;
}

message NamespaceSchema {
  map<string, FieldSchema> fields = 1;
  // Analyzer for Text fields not listed in `fields`. Empty = "standard".
  repeated string default_analyzer = 2;
  // Stopword list for `default_analyzer`'s "stop" filter (built-in English list if empty).
  repeated string default_stopwords = 3;
}

message FieldSchema {
  FieldType type = 1;
  bool indexed = 2;       // whether the field is full-text indexed
  bool stored = 3;        // whether the field value is stored and returned
  // Analyzer, then token filters. Analyzers: "standard" (legacy tokenizer),
  // "standard@2" (Unicode UAX #29), "keyword", "lowercase", "whitespace".
  // Filters: "lowercase", "stop", "stem" (English Snowball). Empty = "standard".
  repeated string analyzer = 4;
  // Stopword list for this field's "stop" filter (built-in English list if empty).
  repeated string stopwords = 5;
}

message PutNamespaceSchemaRequest {
  string namespace = 1;
  NamespaceSchema schema = 2;
}

message PutNamespaceSchemaResponse {
  string namespace = 1;
  NamespaceSchema schema = 2;
  bool changed = 3;  // false when the stored schema was already identical
}

message GetNamespaceSchemaRequest {
  string namespace = 1;
}

message GetNamespaceSchemaResponse {
  string namespace = 1;
  NamespaceSchema schema = 2;
}

enum FieldType {
  FIELD_TYPE_UNSPECIFIED = 0;
  FIELD_TYPE_TEXT = 1;
  FIELD_TYPE_KEYWORD = 2;
  FIELD_TYPE_INTEGER = 3;
  FIELD_TYPE_FLOAT = 4;
  FIELD_TYPE_DATE = 5;
  FIELD_TYPE_BOOLEAN = 6;
  FIELD_TYPE_VECTOR = 7;
}

message CreateNamespaceResponse {
  string id = 1;
  NamespaceSchema schema = 2;
  int64 document_count = 3;
  int64 segment_count = 4;
  int64 version = 5;
  int64 created_at = 6;  // Unix timestamp (seconds)
}

message DeleteNamespaceRequest {
  string namespace = 1;
}

message DeleteNamespaceResponse {
  string namespace = 1;
  bool acknowledged = 2;
}

// ─── Branching (issue #208) ─────────────────────────────────────────────────

message BranchNamespaceRequest {
  string namespace = 1;  // the parent
  string name = 2;       // the new branch
}

// The new branch (same fields as `NamespaceBranch`).
message BranchNamespaceResponse {
  string name = 1;
  string parent = 2;
  int64 parent_version = 3;
  int64 version = 4;
  int64 segments = 5;
  int64 shared_segments = 6;
  int64 documents = 7;
}

message NamespaceBranch {
  string name = 1;
  string parent = 2;
  int64 parent_version = 3;  // parent manifest version the branch started from
  int64 version = 4;
  int64 segments = 5;
  int64 shared_segments = 6;  // segments still read from the parent's prefix
  int64 documents = 7;
}

message ListBranchesRequest {
  string namespace = 1;
}

message ListBranchesResponse {
  string namespace = 1;
  repeated NamespaceBranch branches = 2;
}

message DeleteBranchRequest {
  string namespace = 1;
}

message BranchReclaim {
  int64 local_files = 1;
  int64 remote_objects = 2;
  int64 kept = 3;  // still referenced by another branch
  repeated string errors = 4;
}

message DeleteBranchResponse {
  string deleted = 1;
  string parent = 2;
  int64 version = 3;
  BranchReclaim reclaimed = 4;
}

// ─── Document model ─────────────────────────────────────────────────────────

message Field {
  string name = 1;
  FieldType field_type = 2;
  string value = 3;
}

message Document {
  string id = 1;
  repeated Field fields = 2;
}

// ─── Index ──────────────────────────────────────────────────────────────────

message IndexDocumentsRequest {
  string namespace = 1;
  repeated Document documents = 2;
}

message IndexDocumentsResponse {
  int64 indexed_count = 1;
  string namespace = 2;
}

// ─── Flush ──────────────────────────────────────────────────────────────────

message FlushRequest {
  string namespace = 1;
}

message FlushResponse {
  string status = 1;  // "flushed"
}

// ─── Delete by query ────────────────────────────────────────────────────────

message DeleteByQueryRequest {
  string namespace = 1;
  google.protobuf.Struct filter = 2;   // Kosha-native filter (term/terms/range/bool)
  google.protobuf.Struct query = 3;    // ES-style query (fallback alias for filter)
}

message DeleteByQueryResponse {
  int64 deleted = 1;
  string namespace = 2;
}

// ─── Search ─────────────────────────────────────────────────────────────────

message SearchRequest {
  string namespace = 1;
  string query_text = 2;
  int32 max_results = 3;
  int32 from = 4;

  // BM25 parameters.
  optional double bm25_k1 = 5;
  optional double bm25_b = 6;

  // Filters — Kosha-native filter clause (term/terms/range/bool).
  // Same shape as the ES bool filter that KoshaClient already translates.
  google.protobuf.Struct filter = 7;

  // Sorting.
  repeated SortSpec sort = 8;

  // Highlighting config.
  optional HighlightConfig highlight = 9;

  // Aggregations (keyed by aggregation name).
  map<string, google.protobuf.Struct> aggregations = 10;

  // Wildcard query.
  optional WildcardQuery wildcard = 11;

  // Match phrase query.
  optional MatchPhraseQuery match_phrase = 12;

  // kNN / ANN vector search (Phase 2).
  optional KnnQuery knn = 13;

  // Mode. UNSPECIFIED infers it from the clauses present; any other value
  // is checked against them (HTTP: "mode": "lexical" | "semantic" | "hybrid").
  RetrievalMode mode = 14;

  // How a hybrid request fuses its lexical and kNN lists.
  // HTTP: "rank": {"rrf": {"rank_window_size": 100, "rank_constant": 60}}.
  optional Rank rank = 15;
}

enum RetrievalMode {
  RETRIEVAL_MODE_UNSPECIFIED = 0;
  RETRIEVAL_MODE_LEXICAL = 1;   // query_text / wildcard / match_phrase; no knn
  RETRIEVAL_MODE_SEMANTIC = 2;  // knn only
  // A lexical query plus knn, fused by Reciprocal Rank Fusion over
  // namespace-wide ranks (see Rank). Every request with both is hybrid.
  RETRIEVAL_MODE_HYBRID = 3;
}

message Rank {
  optional RrfRank rrf = 1;
}

// score(d) = sum over retrievers r of 1 / (rank_constant + rank_r(d)).
message RrfRank {
  // Per-retriever list length and fused list length. Default: max_results;
  // must be >= max_results.
  optional int32 rank_window_size = 1;
  // Default 60; must be >= 1.
  optional int32 rank_constant = 2;
}

message SortSpec {
  string field = 1;
  string order = 2;  // "asc" or "desc"
}

// Highlighting (#195). Set `fields` to highlight any number of fields (HTTP:
// "highlight": {"fields": {"title": {}, "body": {"pre_tags": ["<em>"]}}});
// hits then carry the per-field ScoredDocument.highlight map. Each field's
// tags fall back to the top-level pre_tags/post_tags, then to <b>/</b>.
// `field` is the legacy single-field form (hits carry ScoredDocument.highlights);
// setting both `field` and `fields` is an INVALID_ARGUMENT / HTTP 400.
message HighlightConfig {
  // Deprecated: use `fields`.
  string field = 1;
  repeated string pre_tags = 2;
  repeated string post_tags = 3;
  // Fields to highlight, in request order.
  repeated HighlightField fields = 4;
}

message HighlightField {
  string name = 1;
  // Unset/empty falls back to HighlightConfig.pre_tags / post_tags.
  repeated string pre_tags = 2;
  repeated string post_tags = 3;
}

// The fragments highlighted in one field of one hit.
message HighlightFragments {
  repeated string fragments = 1;
}

message WildcardQuery {
  string field = 1;
  string pattern = 2;
  bool case_insensitive = 3;
}

message MatchPhraseQuery {
  string field = 1;
  string phrase = 2;
  int32 slop = 3;
}

message KnnQuery {
  string field = 1;
  repeated float vector = 2;
  int32 k = 3;
  int32 num_candidates = 4;
  google.protobuf.Struct filter = 5;
}

message SearchResponse {
  repeated ScoredDocument results = 1;
  int64 total_hits = 2;
  google.protobuf.Struct aggregations = 3;
}

message ScoredDocument {
  string doc_id = 1;
  double score = 2;  // the fused RRF score for a hybrid request
  repeated Field fields = 3;
  // Deprecated: set only for the legacy single-field HighlightConfig.field
  // request; use `highlight`.
  repeated string highlights = 4;
  // Hybrid requests only.
  optional RankDetails rank_details = 5;
  // Highlight fragments keyed by field name, for a HighlightConfig.fields
  // request (ES "highlight" shape). Fields the hit lacks, or that are not
  // text, are absent.
  map<string, HighlightFragments> highlight = 6;
}

// 1-based ranks in each retriever's namespace-wide list; unset when the hit
// was not in that retriever's window.
message RankDetails {
  optional int32 lexical_rank = 1;
  optional double lexical_score = 2;
  optional int32 knn_rank = 3;
  optional double knn_score = 4;
}

// ─── Stats ──────────────────────────────────────────────────────────────────

message GetStatsRequest {
  optional string namespace = 1;  // if empty, return all namespaces
}

message GetStatsResponse {
  int64 total_documents = 1;
  int64 total_segments = 2;
  repeated NamespaceStats namespaces = 3;
}

message NamespaceStats {
  string namespace = 1;
  int64 documents = 2;
  int64 segments = 3;
  int64 version = 4;
}

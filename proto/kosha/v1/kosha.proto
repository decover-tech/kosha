      extensions: {
        key: "x-kosha-error-codes"
        value: {list_value: {values: [{string_value: "already_exists"}, {string_value: "internal"}, {string_value: "invalid_argument"}, {string_value: "method_not_allowed"}, {string_value: "namespace_quota_exceeded"}, {string_value: "overloaded"}, {string_value: "payload_too_large"}, {string_value: "payment_required"}, {string_value: "permission_denied"}, {string_value: "request_timeout"}, {string_value: "tenant_concurrency_exceeded"}, {string_value: "tenant_qps_exceeded"}, {string_value: "tenant_queue_full"}, {string_value: "unauthenticated"}, {string_value: "unavailable"}]}}
      }
      extensions: {
        key: "x-stability-level"
        value: {string_value: "stable"}
      }
    };
  }

  // The caller's namespaces (issue #214). Shard and other internal

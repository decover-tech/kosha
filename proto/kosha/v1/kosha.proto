syntax = "proto3";

package kosha.v1;

import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "google/protobuf/struct.proto";
import "protoc-gen-openapiv2/options/annotations.proto";

option go_package = "github.com/decover-tech/kosha/proto/kosha/v1;koshav1";
option java_multiple_files = true;
option java_package = "com.decover.kosha.v1";
option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
  info: {
    title: "Kosha API"
    // The contract revision (ADR-350 §a): 1.MINOR.PATCH now that v1 is GA
    // (0.9.x and 0.10.x were pre-GA). Independent of the crate version; kept
    // equal to `api_error::API_VERSION` by a test.
    version: "1.1.0"
    description:
      "The public Kosha HTTP/JSON API. The OpenAPI document is the wire contract; "
      "proto3 canonical JSON is not (see docs/api/versioning.md). Every request carries "
      "a tenant API key (`Authorization: Bearer <key>` or `X-Api-Key: <key>`), and every "
      "namespace in a path is relative to that key's tenant."
  }
  schemes: [HTTPS, HTTP]
  consumes: "application/json"
  produces: "application/json"
  security_definitions: {
    security: {
      key: "BearerAuth"
      value: {
        type: TYPE_API_KEY
        in: IN_HEADER
        name: "Authorization"
        description: "`Bearer <api key>`"
      }
    }
    security: {
      key: "ApiKeyAuth"
      value: {
        type: TYPE_API_KEY
        in: IN_HEADER
        name: "X-Api-Key"
        description: "The API key itself."
      }
    }
  }
  security: {
    security_requirement: {key: "BearerAuth"}
  }
  security: {
    security_requirement: {key: "ApiKeyAuth"}
  }
  responses: {
    key: "400"
    value: {
      description: "invalid_argument, invalid_query"
      schema: {json_schema: {ref: ".kosha.v1.ErrorResponse"}}
    }
  }
  responses: {
    key: "401"
    value: {
      description: "unauthenticated"
      schema: {json_schema: {ref: ".kosha.v1.ErrorResponse"}}
    }
  }
  responses: {
    key: "402"
    value: {
      description: "payment_required (billing refuses the operation for the account's standing)"
      schema: {json_schema: {ref: ".kosha.v1.ErrorResponse"}}
    }
  }
  responses: {
    key: "403"
    value: {
      description: "permission_denied and quota codes"
      schema: {json_schema: {ref: ".kosha.v1.ErrorResponse"}}
    }
  }
  responses: {
    key: "404"
    value: {
      description: "not_found, namespace_not_found"
      schema: {json_schema: {ref: ".kosha.v1.ErrorResponse"}}
    }
  }
  responses: {
    key: "405"
    value: {
      description: "method_not_allowed; the `Allow` header lists the methods the path takes"
      schema: {json_schema: {ref: ".kosha.v1.ErrorResponse"}}
      headers: {
        key: "Allow"
        value: {type: "string"}
      }
    }
  }
  responses: {
    key: "408"
    value: {
      description: "request_timeout: the request body did not arrive in time; retry after `Retry-After` seconds"
      schema: {json_schema: {ref: ".kosha.v1.ErrorResponse"}}
      headers: {
        key: "Retry-After"
        value: {
          type: "integer"
          description: "Seconds to wait before retrying."
        }
      }
    }
  }
  responses: {
    key: "409"
    value: {
      description: "already_exists, conflict, write_conflict; write_conflict is retryable after `Retry-After` seconds"
      schema: {json_schema: {ref: ".kosha.v1.ErrorResponse"}}
      headers: {
        key: "Retry-After"
        value: {
          type: "integer"
          description: "Seconds to wait before retrying; sent with write_conflict only."
        }
      }
    }
  }
  responses: {
    key: "413"
    value: {
      description: "payload_too_large"
      schema: {json_schema: {ref: ".kosha.v1.ErrorResponse"}}
    }
  }
  responses: {
    key: "429"
    value: {
      description: "overloaded and tenant rate limits; retry after `Retry-After` seconds"
      schema: {json_schema: {ref: ".kosha.v1.ErrorResponse"}}
      headers: {
        key: "Retry-After"
        value: {
          type: "integer"
          description: "Seconds to wait before retrying."
        }
      }
    }
  }
  responses: {
    key: "500"
    value: {
      description: "internal"
      schema: {json_schema: {ref: ".kosha.v1.ErrorResponse"}}
    }
  }
  responses: {
    key: "501"
    value: {
      description: "not_implemented: this server was built or configured without the feature (an embedding provider, s3, postgres); not retryable"
      schema: {json_schema: {ref: ".kosha.v1.ErrorResponse"}}
    }
  }
  responses: {
    key: "502"
    value: {
      description: "upstream_error: a provider the server called (embedding) failed; retry after `Retry-After` seconds"
      schema: {json_schema: {ref: ".kosha.v1.ErrorResponse"}}
      headers: {
        key: "Retry-After"
        value: {
          type: "integer"
          description: "Seconds to wait before retrying."
        }
      }
    }
  }
  responses: {
    key: "503"
    value: {
      description: "unavailable; retry after `Retry-After` seconds"
      schema: {json_schema: {ref: ".kosha.v1.ErrorResponse"}}
      headers: {
        key: "Retry-After"
        value: {
          type: "integer"
          description: "Seconds to wait before retrying."
        }
      }
    }
  }
};

// ─── Service ─────────────────────────────────────────────────────────────────
//
// Kosha is a storage-disaggregated search engine with S3 as durable storage
// and local NVMe as a transparent read-through cache (see DESIGN.md §5, §12).
//
// HTTP/JSON is the only transport. This file describes that JSON exactly:
// field names are the snake_case names the server reads and writes, and
// enum-like values are strings with the server's own spellings. The
// generated OpenAPI document (api/openapi/v1/kosha.openapi.json) is the
// published contract; scripts/api/check_wire.py checks it against a live
// server.
//
// Every namespace in a path is relative to the caller's tenant: with a key
// for tenant "acme", `POST /v1/namespaces/docs/search` searches "acme/docs".
// Tenants cannot name each other's namespaces.

service KoshaService {
  // Liveness. Answered before authentication. SDKs use it as `ping`.
  rpc HealthCheck(HealthCheckRequest) returns (HealthCheckResponse) {
    option (google.api.http) = {get: "/v1/healthz"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      security: {}
      responses: {
        key: "429"
        value: {
          description: "overloaded and tenant rate limits; retry after `Retry-After` seconds"
          schema: {json_schema: {ref: ".kosha.v1.ErrorResponse"}}
          headers: {
            key: "Retry-After"
            value: {
              type: "integer"
              description: "Seconds to wait before retrying."
            }
          }
        }
      }
      responses: {
        key: "503"
        value: {
          description: "unavailable; retry after `Retry-After` seconds"
          schema: {json_schema: {ref: ".kosha.v1.ErrorResponse"}}
          headers: {
            key: "Retry-After"
            value: {
              type: "integer"
              description: "Seconds to wait before retrying."
            }
          }
        }
      }
      responses: {
        key: "408"
        value: {
          description: "request_timeout: the request body did not arrive in time; retry after `Retry-After` seconds"
          schema: {json_schema: {ref: ".kosha.v1.ErrorResponse"}}
          headers: {
            key: "Retry-After"
            value: {
              type: "integer"
              description: "Seconds to wait before retrying."
            }
          }
        }
      }
      responses: {
        key: "409"
        value: {
          description: "already_exists, conflict, write_conflict; write_conflict is retryable after `Retry-After` seconds"
          schema: {json_schema: {ref: ".kosha.v1.ErrorResponse"}}
          headers: {
            key: "Retry-After"
            value: {
              type: "integer"
              description: "Seconds to wait before retrying; sent with write_conflict only."
            }
          }
        }
      }
      responses: {
        key: "502"
        value: {
          description: "upstream_error: a provider the server called (embedding) failed; retry after `Retry-After` seconds"
          schema: {json_schema: {ref: ".kosha.v1.ErrorResponse"}}
          headers: {
            key: "Retry-After"
            value: {
              type: "integer"
              description: "Seconds to wait before retrying."
            }
          }
        }
      }
      extensions: {
        key: "x-kosha-error-codes"
        value: {list_value: {values: [{string_value: "unavailable"}]}}
      }
      extensions: {
        key: "x-stability-level"
        value: {string_value: "stable"}
      }
    };
  }

  // Create a namespace with an optional schema.
  rpc CreateNamespace(CreateNamespaceRequest) returns (CreateNamespaceResponse) {
    option (google.api.http) = {
      post: "/v1/namespaces"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      responses: {
        key: "429"
        value: {
          description: "overloaded and tenant rate limits; retry after `Retry-After` seconds"
          schema: {json_schema: {ref: ".kosha.v1.ErrorResponse"}}

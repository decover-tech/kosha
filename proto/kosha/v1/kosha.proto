  // Replace documents by id, merging a partial document onto the latest
  // stored copy (OpenSearch `_update` semantics): fields the request names
  // are replaced, fields it omits are kept. A document whose id is not
  // stored yet is inserted as given.
  rpc ReplaceDocuments(ReplaceDocumentsRequest) returns (ReplaceDocumentsResponse) {
    option (google.api.http) = {
      post: "/v1/namespaces/{namespace}/replace"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      responses: {

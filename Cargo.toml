[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

# Lint policy: warnings during local development, denied in CI via
# `cargo clippy --all-targets --all-features -- -D warnings`.
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[workspace.dependencies]
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
rayon = "1"

# The vector index's k-means / LIRE inner loops are ~50x slower unoptimized,
# which made its recall tests (and every kosha-segment test that builds an
# index) dominate `cargo test` time. Debug assertions stay on.
[profile.dev.package.kosha-vector-spfresh]
opt-level = 3

# Console password hashing (argon2id, #345) does ~19 MiB of memory-hard work
# per hash; unoptimized that is seconds per sign-up or login in tests.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

name: kosha

# Standalone local stack for engine development: MinIO as the S3 stand-in
# (implementation plan step 9), Postgres for the control plane, plus the
# kosha-server image itself.
#
# NOTE: when developing against the full Decover backend, Kosha is deployed
# into the local k8s cluster by the backend repo's Tilt setup instead — see
# docs/local-development.md. This compose file is for working on Kosha alone.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kosha
      POSTGRES_PASSWORD: kosha-dev
      POSTGRES_DB: kosha
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kosha"]
      interval: 2s
      timeout: 2s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # web console
    environment:
      MINIO_ROOT_USER: kosha
      MINIO_ROOT_PASSWORD: kosha-dev-secret
    volumes:
      - minio-data:/data

  # One-shot bucket bootstrap. Retries the alias until MinIO accepts
  # connections, so no healthcheck ordering is required.
  createbuckets:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 kosha kosha-dev-secret; do
        echo 'waiting for minio...'; sleep 2;
      done;
      mc mb --ignore-existing local/dsearch-dev;
      echo 'bucket dsearch-dev ready';
      "

  kosha-server:
    build: .
    image: kosha:latest
    depends_on:
      createbuckets:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    environment:
      KOSHA_API_KEY: sk-kosha-dev  # matches quickstart script
      KOSHA_ROLE: query
      KOSHA_HTTP_PORT: "8080"
      KOSHA_DATA_DIR: /var/lib/kosha/data
      # S3 / MinIO — kosha-server reads these (and standard AWS_* aliases).
      KOSHA_S3_BUCKET: dsearch-dev
      KOSHA_S3_PREFIX: kosha/
      KOSHA_S3_ENDPOINT: http://minio:9000
      KOSHA_S3_FORCE_PATH_STYLE: "true"
      KOSHA_S3_ACCESS_KEY: kosha
      KOSHA_S3_SECRET_KEY: kosha-dev-secret
      AWS_DEFAULT_REGION: us-east-1
      # Manifest control plane
      DATABASE_URL: postgres://kosha:kosha-dev@postgres:5432/kosha
    volumes:
      # Local SSD/cache stand-in. Ephemeral across `docker compose down -v`,
      # but survives container restarts. Source of truth is MinIO + Postgres.
      - kosha-data:/var/lib/kosha/data
    ports:
      - "8080:8080" # HTTP/JSON
      - "50051:50051" # gRPC (from Epic 8)

volumes:
  minio-data:
  pg-data:
  kosha-data:

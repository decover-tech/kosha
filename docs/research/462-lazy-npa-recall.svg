<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 275" role="img" aria-labelledby="title desc">
  <title id="title">Mean recall@10 at five probes, by reassignment skip rate</title>
  <desc id="desc">Recall remains between 98.817 and 99.088 percent. No sample drops half a percentage point from the zero-skip baseline.</desc>
  <rect width="680" height="275" fill="#fff"/>
  <g stroke="#ddd">
    <path d="M70 222.00H650"/>
    <path d="M70 182.00H650"/>
    <path d="M70 142.00H650"/>
    <path d="M70 102.00H650"/>
    <path d="M70 62.00H650"/>
    <path d="M70 22.00H650"/>
  </g>
  <path d="M70 22V222H650" fill="none" stroke="#555"/>
  <g fill="#333" font-family="sans-serif" font-size="12">
    <text x="62" y="226" text-anchor="end">98.2</text>
    <text x="62" y="186" text-anchor="end">98.4</text>
    <text x="62" y="146" text-anchor="end">98.6</text>
    <text x="62" y="106" text-anchor="end">98.8</text>
    <text x="62" y="66" text-anchor="end">99.0</text>
    <text x="62" y="26" text-anchor="end">99.2</text>
    <text x="70.00" y="240" text-anchor="middle">0</text>
    <text x="128.00" y="240" text-anchor="middle">10</text>
    <text x="215.00" y="240" text-anchor="middle">25</text>
    <text x="360.00" y="240" text-anchor="middle">50</text>
    <text x="505.00" y="240" text-anchor="middle">75</text>
    <text x="650.00" y="240" text-anchor="middle">100</text>
    <text x="360" y="261" text-anchor="middle">Requested skip rate (%)</text>
    <text x="17" y="122" transform="rotate(-90 17 122)" text-anchor="middle">Mean recall@10 (%)</text>
    <text x="645" y="186.84" text-anchor="end">0.5 pp below eager baseline</text>
  </g>
  <path d="M70 192.84H650" stroke="#ad4a09" stroke-dasharray="5 4"/>
  <polyline points="70.00,92.84 75.80,94.50 99.00,53.66 128.00,98.66 215.00,44.50 360.00,67.00 505.00,45.34 650.00,57.00" fill="none" stroke="#1956ab" stroke-width="2"/>
  <g fill="#1956ab">
    <circle cx="70.00" cy="92.84" r="3"><title>0% skips: 98.8458% recall</title></circle>
    <circle cx="75.80" cy="94.50" r="3"><title>1% skips: 98.8375% recall</title></circle>
    <circle cx="99.00" cy="53.66" r="3"><title>5% skips: 99.0417% recall</title></circle>
    <circle cx="128.00" cy="98.66" r="3"><title>10% skips: 98.8167% recall</title></circle>
    <circle cx="215.00" cy="44.50" r="3"><title>25% skips: 99.0875% recall</title></circle>
    <circle cx="360.00" cy="67.00" r="3"><title>50% skips: 98.9750% recall</title></circle>
    <circle cx="505.00" cy="45.34" r="3"><title>75% skips: 99.0833% recall</title></circle>
    <circle cx="650.00" cy="57.00" r="3"><title>100% skips: 99.0250% recall</title></circle>
  </g>
</svg>

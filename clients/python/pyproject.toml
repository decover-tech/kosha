[project]
name = "kosha-client"
version = "0.3.1"
description = "OpenSearch-compatible Python client for the Kosha search engine"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [
    { name = "DecoverAI", email = "engineering@decoverai.com" },
]
urls = { Homepage = "https://github.com/decover-tech/kosha", Source = "https://github.com/decover-tech/kosha" }

# The generated stubs package is optional; without it, the client falls back to
# direct HTTP calls (same as v0.1.x behavior).
dependencies = []

[project.optional-dependencies]
stubs = ["kosha-client-stubs>=0.1"]
# The MCP server (`kosha-mcp`, kosha_client.mcp_server).
mcp = ["mcp>=1.20,<2"]
# `kosha-ingest` (kosha_client.ingest): PDF and DOCX text extraction.
ingest = ["pypdf>=4", "python-docx>=1.1"]

[project.scripts]
kosha-mcp = "kosha_client.mcp_server:main"
kosha-ingest = "kosha_client.ingest:main"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]

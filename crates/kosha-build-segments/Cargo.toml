[package]
name = "kosha-build-segments"
description = "Offline parallel segment builder — build immutable segments from corpus shards without a server, then attach via /v1/admin/import-namespace"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "kosha-build-segments"
path = "src/main.rs"

# Measures i8 vector quantization (#210) on segment sets built above.
[[bin]]
name = "kosha-vector-quant-eval"
path = "src/bin/vector_quant_eval.rs"

# Compares segment layouts (input order vs --cluster-layout namespace, #380)
# under the global kNN probe budget at matched recall.
[[bin]]
name = "kosha-cluster-eval"
path = "src/bin/cluster_eval.rs"

# Measures posting-ordered doc_seqs (--doc-reorder posting, #456): posting
# contiguity and the per-entry doc_seq bytes a range would replace.
[[bin]]
name = "kosha-posting-order-eval"
path = "src/bin/posting_order_eval.rs"

# Predicate-aware posting ranking for filtered kNN (#465): postings fetched
# at matched filtered recall, baseline vs ranking only passing postings.
[[bin]]
name = "kosha-filter-knn-eval"
path = "src/bin/filter_knn_eval.rs"

[lints]
workspace = true

[dependencies]
kosha-core = { path = "../kosha-core" }
kosha-segment = { path = "../kosha-segment" }
clap = { version = "4", features = ["derive"] }
serde = { workspace = true }
serde_json = { workspace = true }
rayon = { workspace = true }

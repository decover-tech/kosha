[package]
name = "kosha-build-segments"
description = "Offline parallel segment builder — build immutable segments from corpus shards without a server, then attach via /v1/admin/import-namespace"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "kosha-build-segments"
path = "src/main.rs"

# Measures i8 vector quantization (#210) on segment sets built above.
[[bin]]
name = "kosha-vector-quant-eval"
path = "src/bin/vector_quant_eval.rs"

# Recall / nDCG of late-interaction retrieval (#205) on a token-embedding
# corpus with qrels, against exact MaxSim and mean-pooled single vectors.
[[bin]]
name = "kosha-late-interaction-eval"
path = "src/bin/late_interaction_eval.rs"

[lints]
workspace = true

[dependencies]
kosha-core = { path = "../kosha-core" }
kosha-segment = { path = "../kosha-segment" }
clap = { version = "4", features = ["derive"] }
serde = { workspace = true }
serde_json = { workspace = true }

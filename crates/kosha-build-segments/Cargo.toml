[package]
name = "kosha-build-segments"
description = "Offline parallel segment builder — build immutable segments from corpus shards without a server, then attach via /v1/admin/import-namespace"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "kosha-build-segments"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
kosha-core = { path = "../kosha-core" }
kosha-segment = { path = "../kosha-segment" }
clap = { version = "4", features = ["derive"] }
serde = { workspace = true }
serde_json = { workspace = true }

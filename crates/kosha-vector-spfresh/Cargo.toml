[package]
name = "kosha-vector-spfresh"
description = "SPFresh/SPANN-style posting-based ANN index with LIRE split/merge/reassign: builds kosha segments' vector indexes and merges them in compaction; see README.md"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
# Intentionally empty: pure std, in memory. kosha-segment owns the on-disk
# format; keeping this crate dependency-free keeps that boundary.

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
# Bench-only, one-directional: lets benches/build_query_cost.rs compare
# against kosha's *real* build_hnsw/CosinePoint/flat_knn. src/ never depends
# on kosha-segment or kosha-query.
kosha-segment = { path = "../kosha-segment" }
kosha-query = { path = "../kosha-query" }
instant-distance = "0.6"

[[bench]]
name = "build_query_cost"
harness = false

[dev-dependencies]
cap = "0.1.2"
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "clone_vs_sort"
harness = false

[[bench]]
name = "search_latency"
harness = false

[[bench]]
name = "scoring_profile"
harness = false

[[bench]]
name = "segment_memory"
harness = false

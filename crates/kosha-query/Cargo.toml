[package]
name = "kosha-query"
description = "Read path: BM25 retrieval over cached segments (DESIGN.md §8)"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
kosha-core = { path = "../kosha-core" }
kosha-segment = { path = "../kosha-segment" }
instant-distance = "0.6"
rayon = { workspace = true }
# Fast non-keyed hasher for per-segment doc_seq → score maps (keys are
# segment-local u32 ids, not attacker-chosen strings). Already in the lock.
rustc-hash = "2.1"
serde = { workspace = true }
serde_json = { workspace = true }

# Offline two-tier (head/tail) impact-index analysis (research #387).
[[bin]]
name = "kosha-two-tier-eval"
path = "src/bin/two_tier_eval.rs"

[dev-dependencies]
cap = "0.1.2"
kosha-vector-spfresh = { path = "../kosha-vector-spfresh" }
tempfile = "3"
# Test-only, one-directional (kosha-write never depends on kosha-query):
# tests/lire_compaction_recall.rs compacts through the real Indexer, and
# benches/relevance builds its fixture with it.
kosha-write = { path = "../kosha-write" }
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "clone_vs_sort"
harness = false

[[bench]]
name = "search_latency"
harness = false

[[bench]]
name = "scoring_profile"
harness = false

[[bench]]
name = "segment_memory"
harness = false

[[bench]]
name = "warm_materialize"
harness = false

[[bench]]
name = "topk_blockmax"
harness = false

[[bench]]
name = "filtered_broad_query"
harness = false

[[bench]]
name = "vector_segment_open"
harness = false

[[bench]]
name = "vector_segment_accounting"
harness = false

[[bench]]
name = "knn_open_search"
harness = false

[[bench]]
name = "filter_eval_1m"
harness = false

[[bench]]
name = "field_bm25"
harness = false

[[bench]]
name = "fuzzy_expansion"
harness = false

[[bench]]
name = "filtered_knn"
harness = false

[[bench]]
name = "late_interaction"
harness = false

# Relevance / recall regression harness (#258): nDCG@10, recall@100 and
# filtered-kNN recall vs brute force over scripts/relevance fixtures.
[[bench]]
name = "relevance"
harness = false

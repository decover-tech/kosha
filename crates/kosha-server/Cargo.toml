[package]
name = "kosha-server"
description = "Kosha node binary: ingest / query / compaction roles and API server (DESIGN.md §5, §12)"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
default = []
s3 = ["dep:aws-sdk-s3", "dep:aws-config"]
postgres = ["kosha-control/postgres"]
onnx = ["dep:tract-onnx", "dep:tokenizers"]
migrate = [
    "s3",
    "postgres",
    "dep:aws-sigv4",
    "dep:aws-credential-types",
    "dep:aws-smithy-runtime-api",
    "dep:http",
]
# Named failpoints on the write/publish path (#257), for the crash-point
# harness. Off by default: the `fail_point!` macros compile to nothing.
failpoints = ["fail/failpoints", "kosha-write/failpoints"]

[dependencies]
kosha-core = { path = "../kosha-core" }
kosha-segment = { path = "../kosha-segment" }
kosha-query = { path = "../kosha-query" }
kosha-write = { path = "../kosha-write" }
kosha-control = { path = "../kosha-control" }
kosha-cache = { path = "../kosha-cache" }
serde = { workspace = true }
serde_json = { workspace = true }
aws-sdk-s3 = { version = "1", optional = true }
aws-config = { version = "1", optional = true }
# The HTTP server (http.rs) runs on its own tokio runtime, so tokio is not
# optional. `io-util` also provides `AsyncWriteExt`, used to stream S3
# response bodies chunk-by-chunk into the local cache instead of buffering
# whole objects (see s3_storage::stream_body_to_file).
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "fs", "io-util", "time", "net", "signal", "sync"] }
# HTTP/1.1 server (#259): keep-alive, bounded concurrency, header-read
# timeouts and streamed response bodies. See http.rs.
hyper = { version = "=1.10.1", features = ["server", "http1"] }
hyper-util = { version = "=0.1.20", features = ["tokio"] }
http-body-util = "=0.1.4"
# Optional client-facing TLS (KOSHA_TLS_CERT_PATH / KOSHA_TLS_KEY_PATH).
tokio-rustls = { version = "=0.26.4", default-features = false, features = ["tls12", "aws_lc_rs"] }
# Not optional/migrate-gated: also used for query→ingest write forwarding
# (see main.rs's is_write_path/forward_to_ingest), a core server feature
# independent of the `migrate` CLI subcommand.
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "json", "rustls"] }
tract-onnx = { version = "0.23.10", optional = true }
tokenizers = { version = "0.22.2", default-features = false, features = ["fancy-regex"], optional = true }
aws-sigv4 = { version = "1.5.1", optional = true }
aws-credential-types = { version = "1.3.0", optional = true }
aws-smithy-runtime-api = { version = "1.14.0", optional = true }
http = { version = "1.5.0", optional = true }
# `GET /internal/segment` now streams raw bytes (#259). A peer still running
# an older build answers with `x-kosha-encoding: base64`; `fetch_from_peer`
# decodes that so a rolling upgrade with mixed peers keeps working.
base64 = "0.22"
# Decodes `DATABASE_URL` query parameters exactly as the Postgres client
# (sqlx, through `url`) does, for the internal-TLS sslmode check.
form_urlencoded = "1"
# Per-file checksums in the segment `_COMMIT` marker (segment_commit.rs).
crc32fast = "1"
# `GET /metrics` (#223): Prometheus text exposition. Forbids unsafe code
# itself, like this workspace.
prometheus-client = "0.26"
fail = "0.5"

# Cache writeback control (writeback.rs): start writing a freshly filled
# cache range to disk without waiting, and `syncfs` before the pod reports
# ready. Safe syscall wrappers (this workspace forbids unsafe code); already
# in the dependency tree through `tempfile`.
[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1", default-features = false, features = ["std", "fs"] }

[dev-dependencies]
# A one-thread pool for the scoring-never-writes test (posting_spans).
rayon = { workspace = true }
# Paused clock for budget-wait tests (`hydration_budget`).
tokio = { version = "1", features = ["test-util"] }
# Self-signed certificates for the TLS smoke test (http.rs).
rcgen = "=0.14.5"

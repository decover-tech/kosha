[package]
name = "kosha-server"
description = "Kosha node binary: ingest / query / compaction roles and API server (DESIGN.md §5, §12)"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
default = []
s3 = ["dep:aws-sdk-s3", "dep:aws-config", "dep:tokio"]
postgres = ["kosha-control/postgres"]

[dependencies]
kosha-core = { path = "../kosha-core" }
kosha-segment = { path = "../kosha-segment" }
kosha-query = { path = "../kosha-query" }
kosha-write = { path = "../kosha-write" }
kosha-control = { path = "../kosha-control" }
kosha-cache = { path = "../kosha-cache" }
serde = { workspace = true }
once_cell = "1"
serde_json = { workspace = true }
aws-sdk-s3 = { version = "1", optional = true }
aws-config = { version = "1", optional = true }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros"], optional = true }

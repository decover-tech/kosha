[package]
name = "kosha-server"
description = "Kosha node binary: ingest / query / compaction roles and API server (DESIGN.md §5, §12)"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
default = []
s3 = ["dep:aws-sdk-s3", "dep:aws-config", "dep:tokio"]
postgres = ["kosha-control/postgres"]
migrate = [
    "s3",
    "postgres",
    "dep:aws-sigv4",
    "dep:aws-credential-types",
    "dep:aws-smithy-runtime-api",
    "dep:http",
]

[dependencies]
kosha-core = { path = "../kosha-core" }
kosha-segment = { path = "../kosha-segment" }
kosha-query = { path = "../kosha-query" }
kosha-write = { path = "../kosha-write" }
kosha-control = { path = "../kosha-control" }
kosha-cache = { path = "../kosha-cache" }
serde = { workspace = true }
once_cell = "1"
serde_json = { workspace = true }
aws-sdk-s3 = { version = "1", optional = true }
aws-config = { version = "1", optional = true }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "fs", "time"], optional = true }
# Not optional/migrate-gated: also used for query→ingest write forwarding
# (see main.rs's is_write_path/forward_to_ingest), a core server feature
# independent of the `migrate` CLI subcommand.
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "json", "rustls"] }
aws-sigv4 = { version = "1.5.1", optional = true }
aws-credential-types = { version = "1.3.0", optional = true }
aws-smithy-runtime-api = { version = "1.14.0", optional = true }
http = { version = "1.5.0", optional = true }

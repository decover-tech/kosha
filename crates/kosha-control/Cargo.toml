[package]
name = "kosha-control"
description = "Control plane: namespace registry and manifest store (DESIGN.md §5, §6.3)"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
kosha-core = { path = "../kosha-core" }
serde = { workspace = true }
serde_json = { workspace = true }
# At-rest hash of API keys (api_keys.rs, #346).
sha2 = "0.10"

# Postgres persistence (optional — in-memory is the default).
# `tls-rustls-aws-lc-rs` (#343): without a TLS feature sqlx cannot honor
# `sslmode=require|verify-ca|verify-full`, and `prefer` silently stays
# plaintext. Same crypto provider as the server's own rustls stack.
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "chrono", "uuid", "tls-rustls-aws-lc-rs"], optional = true }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros"], optional = true }

# Ids for organizations, users, projects and API keys (in-memory and Postgres).
uuid = { version = "1", features = ["v4"] }
# Console passwords (identity.rs, #345): argon2id, the memory-hard KDF
# OWASP recommends. Pure Rust (RustCrypto); PHC strings via `password-hash`,
# salts from our own `getrandom` call, so no `rand` feature.
argon2 = { version = "=0.5.3", default-features = false, features = ["alloc", "password-hash"] }
# Random session, verification, reset and invite tokens (identity.rs).
# Already in the tree (uuid, ring); the OS CSPRNG, nothing else.
getrandom = "0.2"

[features]
default = []
postgres = ["sqlx", "tokio"]

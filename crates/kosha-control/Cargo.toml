[package]
name = "kosha-control"
description = "Control plane: namespace registry and manifest store (DESIGN.md §5, §6.3)"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
kosha-core = { path = "../kosha-core" }
serde = { workspace = true }
serde_json = { workspace = true }

# Postgres persistence (optional — in-memory is the default).
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "chrono", "uuid"], optional = true }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros"], optional = true }
uuid = { version = "1", features = ["v4"], optional = true }

[features]
default = []
postgres = ["sqlx", "tokio", "uuid"]

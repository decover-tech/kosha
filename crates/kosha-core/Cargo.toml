[package]
name = "kosha-core"
description = "Shared types for Kosha (namespace/segment identifiers, common errors)"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
roaring = "0.11"
globset = { version = "0.4", default-features = false }
sha2 = "0.10"
jiff = { version = "1.0.1", default-features = false, features = ["std", "tzdb-bundle-always"] }

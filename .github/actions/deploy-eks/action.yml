name: Deploy to EKS
description: >
  Kustomize/kubectl deploy of kosha-server. Customer/account-specific
  values (cluster, S3 bucket, IRSA role) come from inputs / GitHub
  Environment secrets — not from committed k8s YAML. A composite action
  rather than a reusable workflow on purpose: self-hosted ARC runner
  labels don't resolve for jobs defined inside a called reusable
  workflow.

inputs:
  environment:
    description: "GitHub Environment label (staging | production) — used only for image registry selection"
    required: true
  image_tag:
    description: "Image tag to deploy. Falls back to `main` (staging/ECR) or `latest` (production/Docker Hub) if empty."
    required: false
  aws_role_arn:
    required: true
  database_url:
    required: true
  kosha_api_key:
    required: true
  eks_cluster_name:
    description: "Target EKS cluster name"
    required: true
  s3_bucket:
    description: "KOSHA_S3_BUCKET value"
    required: true
  s3_prefix:
    description: "KOSHA_S3_PREFIX value"
    required: true
  irsa_role_arn:
    description: "eks.amazonaws.com/role-arn annotation value"
    required: true
  aws_region:
    description: "AWS region for kubeconfig + ConfigMap"
    required: false
    default: us-east-1
  image_repository:
    description: "Full image repository without tag (e.g. 123.dkr.ecr.us-east-1.amazonaws.com/decover/kosha). If empty, staging uses ECR login output + /decover/kosha; production uses ravidecoverai/kosha."
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ inputs.aws_role_arn }}
        aws-region: ${{ inputs.aws_region }}

    - name: Login to Amazon ECR
      if: inputs.environment == 'staging' && inputs.image_repository == ''
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Install AWS CLI v2
      shell: bash
      run: |
        curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o /tmp/awscliv2.zip
        unzip -q /tmp/awscliv2.zip -d /tmp
        rm /tmp/awscliv2.zip
        sudo /tmp/aws/install --update
        rm -rf /tmp/aws/

    - uses: azure/setup-kubectl@v4

    - name: Set up Kustomize
      shell: bash
      run: |
        curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash -s -- 5.4.3
        sudo mv kustomize /usr/local/bin/

    - name: Resolve per-environment settings
      id: cfg
      shell: bash
      run: |
        if [[ "${{ inputs.environment }}" == "staging" ]]; then
          echo "k8s_dir=k8s/stage" >> "$GITHUB_OUTPUT"
          default_tag="main"
        else
          echo "k8s_dir=k8s/prod" >> "$GITHUB_OUTPUT"
          default_tag="latest"
        fi
        raw_tag="${{ inputs.image_tag }}"
        if [[ -z "$raw_tag" ]]; then
          echo "image_tag=${default_tag}" >> "$GITHUB_OUTPUT"
        else
          echo "image_tag=${raw_tag#v}" >> "$GITHUB_OUTPUT"
        fi

    - name: Update kubeconfig
      shell: bash
      env:
        AWS_REGION: ${{ inputs.aws_region }}
      run: |
        region="${AWS_REGION:-us-east-1}"
        aws eks update-kubeconfig --region "$region" --name ${{ inputs.eks_cluster_name }}

    - name: Deploy
      shell: bash
      working-directory: ${{ steps.cfg.outputs.k8s_dir }}
      env:
        DATABASE_URL: ${{ inputs.database_url }}
        KOSHA_API_KEY: ${{ inputs.kosha_api_key }}
        IMAGE_TAG: ${{ steps.cfg.outputs.image_tag }}
        KOSHA_S3_BUCKET: ${{ inputs.s3_bucket }}
        KOSHA_S3_PREFIX: ${{ inputs.s3_prefix }}
        KOSHA_IRSA_ROLE_ARN: ${{ inputs.irsa_role_arn }}
        KOSHA_AWS_REGION: ${{ inputs.aws_region }}
        IMAGE_REPOSITORY: ${{ inputs.image_repository }}
      run: |
        set -euo pipefail
        region="${KOSHA_AWS_REGION:-us-east-1}"
        if [[ -n "$IMAGE_REPOSITORY" ]]; then
          image="${IMAGE_REPOSITORY}:${IMAGE_TAG}"
        elif [[ "${{ inputs.environment }}" == "staging" ]]; then
          image="${{ steps.login-ecr.outputs.registry }}/decover/kosha:${IMAGE_TAG}"
        else
          image="ravidecoverai/kosha:${IMAGE_TAG}"
        fi
        kustomize edit set image "kosha=${image}"
        kustomize edit add secret kosha-secret \
          --from-literal=database-url="$DATABASE_URL" \
          --from-literal=bootstrap-api-key="$KOSHA_API_KEY"

        # Wire account-specific S3 + IRSA without committing them to git.
        cat > env-wire-patch.yaml <<EOF
        apiVersion: v1
        kind: ConfigMap
        metadata:
          name: kosha-config
          namespace: kosha
        data:
          KOSHA_S3_BUCKET: "${KOSHA_S3_BUCKET}"
          KOSHA_S3_PREFIX: "${KOSHA_S3_PREFIX}"
          AWS_DEFAULT_REGION: "${region}"
        ---
        apiVersion: v1
        kind: ServiceAccount
        metadata:
          name: kosha
          namespace: kosha
          annotations:
            eks.amazonaws.com/role-arn: "${KOSHA_IRSA_ROLE_ARN}"
        EOF
        sed -i 's/^[[:space:]]\{8\}//' env-wire-patch.yaml
        kustomize edit add patch --path env-wire-patch.yaml

        kubectl apply -k .
        kubectl -n kosha rollout restart deployment/kosha
        kubectl -n kosha rollout status deployment/kosha --timeout=5m

name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  proto:
    name: proto lint
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
      - uses: bufbuild/buf-setup-action@v1
        with:
          version: latest
      - uses: bufbuild/buf-lint-action@v1
        with:
          input: proto

  fmt:
    name: rustfmt
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: test
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all-features --locked

  python-client:
    name: python client
    runs-on: blacksmith-4vcpu-ubuntu-2404
    defaults:
      run:
        working-directory: clients/python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install client + pytest
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest
      - name: Run unit tests
        run: python -m pytest tests/ -q

  # Regression tests for the commit_bench_section.sh hook + amend driver
  # (scripts/test_commit_bench_section.sh). Uses a cargo shim so no real
  # cargo bench is invoked — fast and deterministic.
  bench-hook:
    name: bench hook tests
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/test_commit_bench_section.sh

  # The Dockerfile is a release artifact (deployed as `kosha:latest`) — never
  # let it break on main.
  docker:
    name: docker build
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t kosha:ci .

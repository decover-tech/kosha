name: relevance-compare

# Ranking-quality and recall gate (#258): runs the deterministic `relevance`
# bench (crates/kosha-query/benches/relevance) twice on the SAME runner —
#
#   before = HEAD^1 of the PR's test-merge commit (the main tip)
#   after  = the test-merge commit itself
#
# — posts/updates one sticky PR comment with nDCG@10, recall@100 (lexical,
# vector, hybrid) and filtered-kNN recall@10 per selectivity, uploads both
# reports, and FAILS when a metric drops by more than its threshold
# (scripts/relevance/compare.py). The harness is deterministic, so every
# non-zero delta is a real change, not noise.
#
# The "before" build overlays the head's harness and fixture on the base
# tree (adding the [[bench]] entry if the base predates it), so both sides
# measure the same thing. If that does not build, the head is compared with
# the committed scripts/relevance/baseline.json instead.
on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - "crates/kosha-query/**"
      - "crates/kosha-segment/**"
      - "crates/kosha-vector-spfresh/**"
      - "crates/kosha-core/**"
      - "crates/kosha-write/**"
      - "scripts/relevance/**"
      - "Cargo.lock"
      - ".github/workflows/relevance-compare.yml"

concurrency:
  group: relevance-compare-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write   # sticky results comment

env:
  CARGO_TERM_COLOR: always
  # Largest allowed drop, in points (x100), before the job fails.
  RELEVANCE_THRESHOLD: "1.0"
  # Filtered recall at 0.1% selectivity: a few passing documents per query.
  RELEVANCE_THRESHOLD_LOWEST_SELECTIVITY: "2.0"

jobs:
  relevance-script-tests:
    name: relevance scripts unit tests
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/relevance/test_compare.py
      - run: python3 scripts/relevance/test_converters.py

  relevance-compare:
    name: relevance merge-base vs head, comment on PR
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 45
    # The results comment needs a writable token, which fork PRs don't get.
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # need HEAD^1 for the baseline worktree

      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@v2

      - name: Relevance on base (main side of the test merge)
        run: |
          set -euo pipefail
          base_sha="$(git rev-parse HEAD^1)"
          echo "base_sha=$base_sha" >> "$GITHUB_ENV"
          fixture="$GITHUB_WORKSPACE/scripts/relevance/fixtures/synthetic"

          git worktree add --detach "$RUNNER_TEMP/base-tree" "$base_sha"
          bench_dir=crates/kosha-query/benches/relevance
          rm -rf "$RUNNER_TEMP/base-tree/$bench_dir"
          cp -R "$bench_dir" "$RUNNER_TEMP/base-tree/$bench_dir"
          manifest="$RUNNER_TEMP/base-tree/crates/kosha-query/Cargo.toml"
          if ! grep -q '^name = "relevance"' "$manifest"; then
            printf '\n[[bench]]\nname = "relevance"\nharness = false\n' >> "$manifest"
          fi

          # One target dir for both builds: dependencies compile once.
          export CARGO_TARGET_DIR="$GITHUB_WORKSPACE/target"
          cd "$RUNNER_TEMP/base-tree"
          KOSHA_RELEVANCE_JSON="$RUNNER_TEMP/base.json" \
            cargo bench -p kosha-query --bench relevance -- "$fixture" || \
            echo "::warning::relevance harness failed on the base tree — comparing with the committed baseline"

      - name: Relevance on PR head (test-merge commit)
        run: |
          set -euo pipefail
          # The base build is newer than head's sources in the shared target
          # dir; touch them so cargo rebuilds every changed crate.
          find crates -name '*.rs' -exec touch {} +
          KOSHA_RELEVANCE_JSON="$RUNNER_TEMP/head.json" \
            cargo bench -p kosha-query --bench relevance -- \
            "$GITHUB_WORKSPACE/scripts/relevance/fixtures/synthetic"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compare
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -uo pipefail
          python3 scripts/relevance/compare.py \
            --base "$RUNNER_TEMP/base.json" \
            --head "$RUNNER_TEMP/head.json" \
            --baseline scripts/relevance/baseline.json \
            --base-sha "$base_sha" \
            --head-sha "$HEAD_SHA" \
            --threshold "$RELEVANCE_THRESHOLD" \
            --threshold-for "filtered_knn.*@0.1%.*=$RELEVANCE_THRESHOLD_LOWEST_SELECTIVITY" \
            --out "$RUNNER_TEMP/comment.md"
          echo "compare_status=$?" >> "$GITHUB_ENV"

      - name: Post sticky comment
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          [ -f "$RUNNER_TEMP/comment.md" ] || { echo "no comment rendered"; exit 0; }
          marker='<!-- kosha-relevance-compare -->'
          cid="$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
                   --paginate \
                   --jq "[.[] | select(.body | startswith(\"$marker\")) | .id][0] // empty")"
          if [ -n "$cid" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$cid" \
              -F "body=@$RUNNER_TEMP/comment.md" > /dev/null
          else
            gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
              -F "body=@$RUNNER_TEMP/comment.md" > /dev/null
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: relevance-report
          path: |
            ${{ runner.temp }}/base.json
            ${{ runner.temp }}/head.json
            ${{ runner.temp }}/comment.md
          if-no-files-found: warn

      - name: Gate on regressions
        run: |
          if [ "${compare_status:-1}" != "0" ]; then
            echo "::error::relevance/recall regressed past the threshold (see the PR comment)"
            exit 1
          fi

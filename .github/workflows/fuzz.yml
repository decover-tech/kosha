name: Nightly fuzz & fault injection

# Write-path durability testing (#257), too slow for every PR:
# - every cargo-fuzz target in fuzz/ for FUZZ_SECONDS each (6 targets x
#   120s = 12 minutes of fuzzing per night), crashes uploaded as artifacts;
# - the failpoint crash matrix, the interleaving schedules and the
#   property tests at much higher counts than `cargo test` runs.

on:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:
    inputs:
      seconds:
        description: "Seconds per fuzz target"
        default: "120"

env:
  CARGO_TERM_COLOR: always

jobs:
  fuzz:
    name: fuzz ${{ matrix.target }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    strategy:
      fail-fast: false
      matrix:
        target:
          - wal_decode
          - segment_open
          - footer_json
          - filter_column_decode
          - vector_idx_parse
          - multivec_bag
    env:
      FUZZ_SECONDS: ${{ github.event.inputs.seconds || '120' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Restore corpus
        uses: actions/cache@v4
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-
      - name: Fuzz
        working-directory: fuzz
        run: |
          mkdir -p corpus/${{ matrix.target }}
          cargo +nightly fuzz run ${{ matrix.target }} corpus/${{ matrix.target }} -- \
            -max_total_time=$FUZZ_SECONDS -rss_limit_mb=2048 -timeout=30
      - name: Upload crashes
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashes-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}
          if-no-files-found: ignore

  fault-injection:
    name: failpoint matrix + interleavings + properties
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
      - name: Crash-point matrix (one test per failpoint)
        run: cargo test -p kosha-server --all-features --locked crash_points_tests
      - name: Interleavings (10,000 schedules)
        env:
          KOSHA_INTERLEAVING_SCHEDULES: "2500"
        run: cargo test -p kosha-write --features failpoints --locked --test interleavings
      - name: Property tests (5,000 cases each)
        env:
          PROPTEST_CASES: "5000"
        run: |
          cargo test -p kosha-write --locked --test wal_proptest
          cargo test -p kosha-segment --locked --test decoder_proptest
          KOSHA_FILTERS_WRITE_VERSION=2 cargo test -p kosha-segment --locked --test decoder_proptest

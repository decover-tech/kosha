name: tachyon shadow

# Benchmark only: cargo test compile and run on the same commit, cold (no
# cache) and warm, on Tachyon (warm = prebuilt target/), Blacksmith and
# GitHub-hosted (warm = rust-cache). Not a required check; runs only on
# this branch.
on:
  push:
    branches: [devin/tachyon-shadow]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  tachyon-warm:
    # "prebuilt" keeps this job off tachyon-cold's runner (GitHub gives a job any runner whose labels cover its own).
    runs-on: [tachyon-ubuntu-24.04-4x, prebuilt]
    env:
      AGENT_TOOLSDIRECTORY: /opt/hostedtoolcache
    steps:
      - uses: actions/checkout@v4
      - name: Tachyon warm
        # Same as decover-tech/tachyon/actions/warm (private, so inlined):
        # moves prebuild workspace paths back after checkout.
        shell: bash
        run: |
          set -euo pipefail
          stash="${TACHYON_WARM_STASH:-/opt/tachyon/warm}"
          result=miss
          if [[ -n "${TACHYON_JOB_ID:-}" && "${TACHYON_PREBUILD_MATCH:-none}" == full && -n "${TACHYON_WARM_PATHS:-}" ]]; then
            result=hit
            IFS=: read -ra paths <<< "$TACHYON_WARM_PATHS"
            for p in "${paths[@]}"; do
              case "$p" in /*|*..*) result=miss; continue;; esac
              if [[ -e "$stash/$p" ]]; then
                mkdir -p "$(dirname "$GITHUB_WORKSPACE/$p")"
                rm -rf "${GITHUB_WORKSPACE:?}/$p"
                mv "$stash/$p" "$GITHUB_WORKSPACE/$p"
              else
                result=miss
              fi
            done
          fi
          echo "Tachyon warm: $result (prebuild match: ${TACHYON_PREBUILD_MATCH:-none})"
          # Cargo fingerprints hold absolute paths and mtimes. Build where
          # the prebuild built (its workspace path), age every file, then
          # re-touch only the files changed since the prebuild's commit.
          ws=/home/runner/work/_tachyon/workspace
          base=$(cat "$GITHUB_WORKSPACE/target/.tachyon-prebuild-sha" 2>/dev/null || true)
          if [[ $result == hit && -n "$base" ]] && { git cat-file -e "$base^{commit}" 2>/dev/null || git fetch -q --depth=1 origin "$base"; } && rm -rf "$ws" && mkdir -p "$ws"; then
            mv "$GITHUB_WORKSPACE/target" "$ws/target"
            cp -a "$GITHUB_WORKSPACE/." "$ws/"
            cd "$ws"
            git ls-files -z | xargs -0 touch -h -d @1
            changed=$(git diff --name-only "$base" HEAD | wc -l)
            git diff --name-only --diff-filter=d -z "$base" HEAD | xargs -0 -r touch -h -c
            echo "KOSHA_DIR=$ws" >> "$GITHUB_ENV"
            echo "building in $ws; mtimes reset against prebuild ${base:0:7}; $changed file(s) changed"
          fi
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      # The prebuild compiled with cargo's default incremental setting;
      # rust-toolchain exports CARGO_INCREMENTAL=0, which is part of every
      # workspace crate's fingerprint.
      - name: compile
        working-directory: ${{ env.KOSHA_DIR || github.workspace }}
        env:
          CARGO_INCREMENTAL: 1
          CARGO_LOG: cargo::core::compiler::fingerprint=info
        run: cargo test --all-features --locked --no-run
      - name: test
        working-directory: ${{ env.KOSHA_DIR || github.workspace }}
        env:
          CARGO_INCREMENTAL: 1
        run: cargo test --all-features --locked

  tachyon-cold:
    runs-on: [tachyon-ubuntu-24.04-4x, tachyon-clean]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - name: compile
        run: cargo test --all-features --locked --no-run
      - name: test
        run: cargo test --all-features --locked

  blacksmith-warm:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: shadow-blacksmith
      - name: compile
        run: cargo test --all-features --locked --no-run
      - name: test
        run: cargo test --all-features --locked

  blacksmith-cold:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - name: compile
        run: cargo test --all-features --locked --no-run
      - name: test
        run: cargo test --all-features --locked

  github-warm:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: shadow-github
      - name: compile
        run: cargo test --all-features --locked --no-run
      - name: test
        run: cargo test --all-features --locked

  github-cold:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - name: compile
        run: cargo test --all-features --locked --no-run
      - name: test
        run: cargo test --all-features --locked

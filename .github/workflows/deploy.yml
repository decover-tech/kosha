name: Deploy to EKS

# Manual on-demand deploy — e.g. to force a rollout without a new build, or
# to redeploy/roll back to a specific previously-published tag. The
# automatic path (staging on push to main, production on v* tags) lives in
# release.yml; both call the same deploy-eks composite action so the actual
# kustomize/kubectl steps only exist in one place.
#
# This is a composite action rather than a reusable workflow on purpose:
# self-hosted ARC runner labels (nonprod-runner-kosha) don't resolve for a
# job defined inside a called reusable workflow — GitHub can't find a
# matching runner and the run fails instantly (startup_failure, no jobs
# ever created). The job — and its runs-on — has to live here.

on:
  workflow_dispatch:
    inputs:
      environment:
        # production is deliberately not offered yet — no AWS role/EKS
        # access set up for that account. Add it back to `options` once
        # deploy-production in release.yml is re-enabled.
        description: "Environment to deploy to"
        required: true
        type: choice
        options:
          - staging
        default: staging
      image_tag:
        description: "Image tag to deploy (blank = main for staging, latest for production). Use this to redeploy a specific version."
        required: false
        type: string

jobs:
  deploy:
    name: Deploy to EKS (${{ inputs.environment }})
    runs-on: nonprod-runner-kosha
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write # AWS OIDC
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/deploy-eks
        with:
          environment: ${{ inputs.environment }}
          image_tag: ${{ inputs.image_tag }}
          aws_role_arn: ${{ secrets.AWS_GITHUB_ROLE_ARN }}
          database_url: ${{ secrets.KOSHA_DATABASE_URL }}
          kosha_api_key: ${{ secrets.KOSHA_API_KEY }}

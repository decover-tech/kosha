name: Release

# Publishes kosha-server to two registries from one multi-arch build:
#
#   Docker Hub docker.io/ravidecoverai/kosha                          (public / prod pulls)
#   ECR        <nonprod>.dkr.ecr.us-east-1.amazonaws.com/decover/kosha (staging pulls)
#
#   push to main        -> :main          (floating, what staging tracks)
#   tag v0.2.5          -> :0.2.5, :0.2, :latest
#
# amd64 and arm64 build on native runners instead of cross-compiling arm64
# under QEMU emulation — Rust under QEMU was taking 2+ hours per release.
# Each platform job pushes its image by digest to both registries
# (cache-from/to makes the 2nd push near-instant once the first has
# compiled), then the merge job combines the available per-platform digests
# into one multi-arch manifest per registry via `buildx imagetools` (works
# the same whether it's combining one platform or two).
#
# amd64 runs on Blacksmith (blacksmith-4vcpu-ubuntu-2404 + useblacksmith's
# builder/build-push actions) — same pattern already proven across this org
# (see e.g. the backend repo's deploy.yml). Cache is registry-based
# (type=registry + inline) rather than type=gha: it isn't subject to GHA's
# 10GB-per-repo eviction, and both registry pushes below read from the same
# public Docker Hub `:main` cache ref regardless of which one is pushing.
#
# arm64 stays on GitHub's native ubuntu-24.04-arm runner — no Blacksmith ARM
# runner exists anywhere in this org to switch to — but only builds on `v*`
# tags now, not every push to main. It was previously built on every push,
# doubling build time for the common case even though only tagged releases
# actually need the arm64 image (public Docker Hub distribution); staging
# only ever pulls amd64 from ECR.
#
# GHCR was dropped: Docker Hub + ECR cover public distribution and internal
# staging pulls respectively.
#
# Trade-off: build-time provenance attestation is off (provenance: false) for
# the by-digest builds — combining provenance across a cross-registry manifest
# merge is a separate, more involved setup. Revisit if SLSA attestations become
# a requirement.
#
# AWS auth: OIDC via the AWS_GITHUB_ROLE_ARN secret (GitHubActionsKoshaRole —
# trust scoped to this repo's main branch + v* tags). The ECR registry is
# derived from the role's account at login, so pointing the secret at a role
# in another account moves the push there with no workflow change. Staging
# uses a role in the staging account (push rights only to decover/kosha
# there) so the staging cluster pulls in-account, like every other service.
#
# Docker Hub: requires repo secrets DOCKERHUB_USERNAME and DOCKERHUB_TOKEN
# (a Docker Hub access token with read/write/delete on ravidecoverai/kosha).
#
# Deploy: after each successful merge, deploy-staging (push to main) and
# deploy-production (v* tags) call deploy-eks.yml (reusable) to
# kustomize-apply k8s/{stage,prod} to the real EKS clusters (named by each
# environment's EKS_CLUSTER_NAME secret) and force a rollout restart, since
# `kubectl apply` alone is a no-op when a floating tag string like `:main`
# hasn't changed. Each needs its own GitHub Environment ("staging" /
# "production") with secrets AWS_GITHUB_ROLE_ARN (must also have EKS RBAC —
# an access entry or aws-auth mapping — granting it write access to the
# `kosha` namespace), plus KOSHA_DATABASE_URL, KOSHA_API_KEY,
# KOSHA_S3_BUCKET, KOSHA_S3_PREFIX, KOSHA_IRSA_ROLE_ARN, EKS_CLUSTER_NAME
# (and optional KOSHA_AWS_REGION). See k8s/README.md. For an on-demand
# redeploy/rollback without a new build,

# use the separate "Deploy to EKS" workflow (deploy.yml,
# workflow_dispatch) — it calls the same reusable workflow.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  DOCKERHUB_IMAGE: ravidecoverai/kosha
  AWS_REGION: us-east-1
  ECR_REPOSITORY: decover/kosha

jobs:
  build-amd64:
    name: build (linux/amd64)
    # TEMPORARY: Blacksmith runners are not picking up jobs for this repo
    # (amd64 build queued indefinitely with no runner assigned on the
    # v0.1.0 release run). Falling back to the GitHub-hosted runner and
    # standard docker/* actions until Blacksmith recovers, then revert to
    # blacksmith-4vcpu-ubuntu-2404 + useblacksmith/* actions.
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read
      id-token: write # AWS OIDC
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set per-job env
        run: |
          echo "ECR_IMAGE=${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}" >> "$GITHUB_ENV"

      # Cache is the public Docker Hub `:main` image's inline cache — both
      # pushes below read from it regardless of which registry they push to.
      # Only the Docker Hub push writes it back (cache-to); nothing needs to
      # read a cache from the ECR image.
      - name: Build and push by digest (Docker Hub)
        id: build-dockerhub
        uses: docker/build-push-action@v6
        with:
          platforms: linux/amd64
          provenance: false
          outputs: type=image,name=${{ env.DOCKERHUB_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=registry,ref=${{ env.DOCKERHUB_IMAGE }}:main
          cache-to: type=inline

      - name: Build and push by digest (ECR)
        id: build-ecr
        uses: docker/build-push-action@v6
        with:
          platforms: linux/amd64
          provenance: false
          outputs: type=image,name=${{ env.ECR_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=registry,ref=${{ env.DOCKERHUB_IMAGE }}:main

      - name: Export digests
        run: |
          mkdir -p /tmp/digests/dockerhub /tmp/digests/ecr
          dockerhub_digest="${{ steps.build-dockerhub.outputs.digest }}"
          ecr_digest="${{ steps.build-ecr.outputs.digest }}"
          touch "/tmp/digests/dockerhub/${dockerhub_digest#sha256:}"
          touch "/tmp/digests/ecr/${ecr_digest#sha256:}"

      - name: Upload digests
        uses: actions/upload-artifact@v4
        with:
          name: digests-linux-amd64
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  build-arm64:
    name: build (linux/arm64)
    # Only tagged releases need arm64 (public Docker Hub distribution) —
    # staging only ever pulls amd64 from ECR. Building it on every push to
    # main used to double build time for no benefit on the common path.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: blacksmith-4vcpu-ubuntu-2404-arm
    permissions:
      contents: read
      id-token: write # AWS OIDC
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set per-job env
        run: |
          echo "ECR_IMAGE=${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}" >> "$GITHUB_ENV"

      # First push writes the GHA layer cache; subsequent registry pushes reuse it.
      - name: Build and push by digest (Docker Hub)
        id: build-dockerhub
        uses: docker/build-push-action@v6
        with:
          platforms: linux/arm64
          provenance: false
          outputs: type=image,name=${{ env.DOCKERHUB_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=linux/arm64
          cache-to: type=gha,mode=max,scope=linux/arm64

      - name: Build and push by digest (ECR)
        id: build-ecr
        uses: docker/build-push-action@v6
        with:
          platforms: linux/arm64
          provenance: false
          outputs: type=image,name=${{ env.ECR_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=linux/arm64

      - name: Export digests
        run: |
          mkdir -p /tmp/digests/dockerhub /tmp/digests/ecr
          dockerhub_digest="${{ steps.build-dockerhub.outputs.digest }}"
          ecr_digest="${{ steps.build-ecr.outputs.digest }}"
          touch "/tmp/digests/dockerhub/${dockerhub_digest#sha256:}"
          touch "/tmp/digests/ecr/${ecr_digest#sha256:}"

      - name: Upload digests
        uses: actions/upload-artifact@v4
        with:
          name: digests-linux-arm64
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: merge multi-arch manifests
    runs-on: blacksmith-4vcpu-ubuntu-2404
    needs: [build-amd64, build-arm64]
    if: |
      always() &&
      needs.build-amd64.result == 'success' &&
      (needs.build-arm64.result == 'success' || needs.build-arm64.result == 'skipped')
    permissions:
      contents: read
      id-token: write # AWS OIDC
    steps:
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set per-job env
        run: |
          echo "ECR_IMAGE=${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}" >> "$GITHUB_ENV"

      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: |
            ${{ env.DOCKERHUB_IMAGE }}
            ${{ env.ECR_IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Create and push Docker Hub manifest
        working-directory: /tmp/digests/dockerhub
        run: |
          tags=$(jq -cr --arg img "$DOCKERHUB_IMAGE" '.tags[] | select(startswith($img)) | "-t " + .' <<< "$DOCKER_METADATA_OUTPUT_JSON" | tr '\n' ' ')
          # Build one source ref per digest file. Do not use printf with a
          # multi-arg format — with two platform digests printf reuses the
          # format and emits a bare "<digest>@sha256:" that imagetools rejects.
          sources=()
          for digest in *; do
            sources+=("${DOCKERHUB_IMAGE}@sha256:${digest}")
          done
          docker buildx imagetools create $tags "${sources[@]}"

      - name: Create and push ECR manifest
        working-directory: /tmp/digests/ecr
        run: |
          tags=$(jq -cr --arg img "$ECR_IMAGE" '.tags[] | select(startswith($img)) | "-t " + .' <<< "$DOCKER_METADATA_OUTPUT_JSON" | tr '\n' ' ')
          sources=()
          for digest in *; do
            sources+=("${ECR_IMAGE}@sha256:${digest}")
          done
          docker buildx imagetools create $tags "${sources[@]}"

  # These call the deploy-eks composite action rather than a reusable
  # workflow — self-hosted ARC runner labels don't resolve for jobs defined
  # inside a called reusable workflow, so runs-on has to live directly in
  # the job that triggers on push/tag. See .github/actions/deploy-eks.
  deploy-staging:
    name: Deploy to EKS (staging)
    needs: merge
    if: github.ref == 'refs/heads/main'
    runs-on: nonprod-runner-kosha
    environment: staging
    permissions:
      contents: read
      id-token: write # AWS OIDC
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/deploy-eks
        with:
          environment: staging
          image_tag: main
          aws_role_arn: ${{ secrets.AWS_GITHUB_ROLE_ARN }}
          database_url: ${{ secrets.KOSHA_DATABASE_URL }}
          kosha_api_key: ${{ secrets.KOSHA_API_KEY }}
          eks_cluster_name: ${{ secrets.EKS_CLUSTER_NAME }}
          s3_bucket: ${{ secrets.KOSHA_S3_BUCKET }}
          s3_prefix: ${{ secrets.KOSHA_S3_PREFIX }}
          irsa_role_arn: ${{ secrets.KOSHA_IRSA_ROLE_ARN }}
          aws_region: ${{ secrets.KOSHA_AWS_REGION }}

  deploy-production:
    name: Deploy to EKS (production)
    needs: merge
    # Temporarily disabled — staging deploy is still being validated end to
    # end, and production doesn't have its own AWS role/EKS access (or its
    # own ARC runner — prod-runner-kosha doesn't exist yet) set up yet.
    # Restore `startsWith(github.ref, 'refs/tags/v')` once that's done.
    if: false
    runs-on: prod-runner-kosha
    environment: production
    permissions:
      contents: read
      id-token: write # AWS OIDC
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/deploy-eks
        with:
          environment: production
          image_tag: ${{ github.ref_name }}
          aws_role_arn: ${{ secrets.AWS_GITHUB_ROLE_ARN }}
          database_url: ${{ secrets.KOSHA_DATABASE_URL }}
          kosha_api_key: ${{ secrets.KOSHA_API_KEY }}
          eks_cluster_name: ${{ secrets.EKS_CLUSTER_NAME }}
          s3_bucket: ${{ secrets.KOSHA_S3_BUCKET }}
          s3_prefix: ${{ secrets.KOSHA_S3_PREFIX }}
          irsa_role_arn: ${{ secrets.KOSHA_IRSA_ROLE_ARN }}
          aws_region: ${{ secrets.KOSHA_AWS_REGION }}

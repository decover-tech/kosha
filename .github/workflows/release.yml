name: Release

# Publishes kosha-server to two registries from one multi-arch build:
#
#   Docker Hub docker.io/ravidecoverai/kosha                          (public / prod pulls)
#   ECR        <nonprod>.dkr.ecr.us-east-1.amazonaws.com/decover/kosha (staging pulls)
#
#   push to main        -> :main          (floating, what staging tracks)
#   tag v0.2.5          -> :0.2.5, :0.2, :latest
#
# amd64 and arm64 build on native runners (ubuntu-latest / ubuntu-24.04-arm)
# instead of cross-compiling arm64 under QEMU emulation — Rust under QEMU was
# taking 2+ hours per release. Each platform job pushes its image by digest to
# both registries (cache-from/to makes the 2nd push near-instant once the
# first has compiled), then the merge job combines the two per-platform
# digests into one multi-arch manifest per registry via `buildx imagetools`.
#
# GHCR was dropped: Docker Hub + ECR cover public distribution and internal
# staging pulls respectively.
#
# Trade-off: build-time provenance attestation is off (provenance: false) for
# the by-digest builds — combining provenance across a cross-registry manifest
# merge is a separate, more involved setup. Revisit if SLSA attestations become
# a requirement.
#
# AWS auth: OIDC via the AWS_GITHUB_ROLE_ARN secret (GitHubActionsKoshaRole —
# trust scoped to this repo's main branch + v* tags). The ECR registry is
# derived from the role's account at login, so pointing the secret at a role
# in another account moves the push there with no workflow change. Staging
# uses a role in account 010928200670 (push rights only to decover/kosha
# there) so the staging cluster pulls in-account, like every other service.
#
# Docker Hub: requires repo secrets DOCKERHUB_USERNAME and DOCKERHUB_TOKEN
# (a Docker Hub access token with read/write/delete on ravidecoverai/kosha).
#
# Deploy: after each successful merge, deploy-staging (push to main) and
# deploy-production (v* tags) call deploy-eks.yml (reusable) to
# kustomize-apply k8s/{stage,prod} to the real EKS clusters
# (decoverai-nonprod / decoverai-prod) and force a rollout restart, since
# `kubectl apply` alone is a no-op when a floating tag string like `:main`
# hasn't changed. Each needs its own GitHub Environment ("staging" /
# "production") with secrets AWS_GITHUB_ROLE_ARN (must also have EKS RBAC —
# an access entry or aws-auth mapping — granting it write access to the
# `kosha` namespace), KOSHA_DATABASE_URL, and KOSHA_API_KEY. See
# k8s/README.md. For an on-demand redeploy/rollback without a new build,
# use the separate "Deploy to EKS" workflow (deploy.yml,
# workflow_dispatch) — it calls the same reusable workflow.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  DOCKERHUB_IMAGE: ravidecoverai/kosha
  AWS_REGION: us-east-1
  ECR_REPOSITORY: decover/kosha

jobs:
  build:
    name: build (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      id-token: write # AWS OIDC
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set per-job env
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"
          echo "ECR_IMAGE=${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}" >> "$GITHUB_ENV"

      # First push writes the GHA layer cache; subsequent registry pushes reuse it.
      - name: Build and push by digest (Docker Hub)
        id: build-dockerhub
        uses: docker/build-push-action@v6
        with:
          platforms: ${{ matrix.platform }}
          provenance: false
          outputs: type=image,name=${{ env.DOCKERHUB_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}

      - name: Build and push by digest (ECR)
        id: build-ecr
        uses: docker/build-push-action@v6
        with:
          platforms: ${{ matrix.platform }}
          provenance: false
          outputs: type=image,name=${{ env.ECR_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.platform }}

      - name: Export digests
        run: |
          mkdir -p /tmp/digests/dockerhub /tmp/digests/ecr
          dockerhub_digest="${{ steps.build-dockerhub.outputs.digest }}"
          ecr_digest="${{ steps.build-ecr.outputs.digest }}"
          touch "/tmp/digests/dockerhub/${dockerhub_digest#sha256:}"
          touch "/tmp/digests/ecr/${ecr_digest#sha256:}"

      - name: Upload digests
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: merge multi-arch manifests
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      id-token: write # AWS OIDC
    steps:
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set per-job env
        run: |
          echo "ECR_IMAGE=${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}" >> "$GITHUB_ENV"

      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: |
            ${{ env.DOCKERHUB_IMAGE }}
            ${{ env.ECR_IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Create and push Docker Hub manifest
        working-directory: /tmp/digests/dockerhub
        run: |
          tags=$(jq -cr --arg img "$DOCKERHUB_IMAGE" '.tags[] | select(startswith($img)) | "-t " + .' <<< "$DOCKER_METADATA_OUTPUT_JSON" | tr '\n' ' ')
          # Build one source ref per digest file. Do not use printf with a
          # multi-arg format — with two platform digests printf reuses the
          # format and emits a bare "<digest>@sha256:" that imagetools rejects.
          sources=()
          for digest in *; do
            sources+=("${DOCKERHUB_IMAGE}@sha256:${digest}")
          done
          docker buildx imagetools create $tags "${sources[@]}"

      - name: Create and push ECR manifest
        working-directory: /tmp/digests/ecr
        run: |
          tags=$(jq -cr --arg img "$ECR_IMAGE" '.tags[] | select(startswith($img)) | "-t " + .' <<< "$DOCKER_METADATA_OUTPUT_JSON" | tr '\n' ' ')
          sources=()
          for digest in *; do
            sources+=("${ECR_IMAGE}@sha256:${digest}")
          done
          docker buildx imagetools create $tags "${sources[@]}"

  deploy-staging:
    name: Deploy to EKS (staging)
    needs: merge
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/deploy-eks.yml
    with:
      environment: staging
      image_tag: main
    secrets: inherit

  deploy-production:
    name: Deploy to EKS (production)
    needs: merge
    # Temporarily disabled — staging deploy is still being validated end to
    # end, and production doesn't have its own AWS role/EKS access set up
    # yet. Restore `startsWith(github.ref, 'refs/tags/v')` once that's done.
    if: false
    uses: ./.github/workflows/deploy-eks.yml
    with:
      environment: production
      image_tag: ${{ github.ref_name }}
    secrets: inherit

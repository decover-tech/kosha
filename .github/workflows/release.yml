name: Release

# Publishes kosha-server to three registries from one build:
#
#   GHCR       ghcr.io/decover-tech/kosha                             (public face)
#   Docker Hub docker.io/decoverai/kosha                              (public pulls)
#   ECR        <nonprod>.dkr.ecr.us-east-1.amazonaws.com/decover/kosha (staging pulls)
#
#   push to main        -> :main          (floating, what staging tracks)
#   tag v0.2.5          -> :0.2.5, :0.2, :latest
#
# AWS auth: OIDC via the AWS_GITHUB_ROLE_ARN secret (GitHubActionsKoshaRole —
# trust scoped to this repo's main branch + v* tags). The ECR registry is
# derived from the role's account at login, so pointing the secret at a role
# in another account moves the push there with no workflow change. Staging
# uses a role in account 010928200670 (push rights only to decover/kosha
# there) so the staging cluster pulls in-account, like every other service.
#
# GHCR: the package stays private until flipped: GitHub org -> Packages ->
# kosha -> Package settings -> connect this repo -> Change visibility: public.
#
# Docker Hub: requires repo secrets DOCKERHUB_USERNAME and DOCKERHUB_TOKEN
# (a Docker Hub access token with read/write/delete on decoverai/kosha).

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/kosha
  DOCKERHUB_IMAGE: decoverai/kosha
  AWS_REGION: us-east-1
  ECR_REPOSITORY: decover/kosha

jobs:
  publish:
    name: build + push multi-arch image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write # AWS OIDC
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: |
            ${{ env.IMAGE }}
            ${{ env.DOCKERHUB_IMAGE }}
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}

      - uses: docker/build-push-action@v6
        with:
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true

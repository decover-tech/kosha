name: conformance

# End-to-end correctness gate: brings up the full stack (MinIO + Postgres +
# kosha-server built from this commit) and runs scripts/conformance against
# it — BM25 and filters checked exactly against a reference model across
# flush, upsert, delete, compaction and a cold restart. Known bugs are listed
# in scripts/conformance/expected_failures.json; anything else fails the job.
#
# The same stack then checks every OpenSearch / Elasticsearch DSL case in
# scripts/conformance/dsl/cases.yaml through kosha-client (Python) and
# regenerates docs/compat/opensearch.{md,json}; a stale matrix fails the job.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  conformance:
    name: BM25 + filters
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Start stack
        run: |
          docker compose -f docker-compose.yml \
            -f scripts/conformance/docker-compose.conformance.yml up --build -d

      - name: Run conformance suite
        run: |
          python3 scripts/conformance/run.py \
            --host http://localhost:8080 --api-key sk-kosha-dev \
            --admin-key sk-kosha-admin-dev \
            --restart-cmd scripts/conformance/compose_restart_cold.sh \
            --out conformance-report.json

      # Requests and responses against the checked-in OpenAPI document
      # (#350): an unknown or missing field on either side fails.
      - name: Wire check
        run: |
          python3 scripts/api/check_wire.py \
            --host http://localhost:8080 --api-key sk-kosha-dev \
            --admin-key sk-kosha-admin-dev

      # The stack runs with KOSHA_LEGACY_ROUTES=off (the conformance
      # overlay): every kosha_client operation must work on /v1 alone.
      - name: Python client smoke (legacy routes off)
        run: python3 scripts/api/client_smoke.py --host http://localhost:8080 --api-key sk-kosha-dev

      # ADR-350 §c guards / plan acceptance 8: the client test suite, then the
      # BM25 bench loader and query driver briefly, all against the legacy-off
      # stack. The log check below then proves none of them touched a legacy
      # route.
      - name: Python client tests
        run: |
          python3 -m venv .venv-legacy-off
          .venv-legacy-off/bin/pip install --quiet -e clients/python pytest pyyaml numpy requests  # pyyaml: tests/test_dsl_registry.py
          .venv-legacy-off/bin/python -m pytest clients/python/tests -q

      - name: Bench scripts smoke (legacy routes off)
        run: |
          PATH=$PWD/.venv-legacy-off/bin:$PATH \
            scripts/api/bench_smoke.sh http://localhost:8080 sk-kosha-dev sk-kosha-admin-dev

      # After the suite above, so its python3 (system, stdlib only) is
      # unchanged. The DSL runner needs PyYAML.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: OpenSearch DSL compatibility matrix
        run: |
          python -m pip install pyyaml pytest
          python scripts/conformance/dsl/run.py \
            --host http://localhost:8080 --api-key sk-kosha-dev \
            --admin-key sk-kosha-admin-dev \
            --out dsl-report.json

      - name: Compatibility matrix is up to date
        run: |
          git diff --stat -- docs/compat/
          if [ -n "$(git status --porcelain -- docs/compat/)" ]; then
            git diff -- docs/compat/ | head -100
            echo "::error::docs/compat/ is stale. Run 'make compat-matrix' and commit the result."
            exit 1
          fi

      # The ES -> Kosha copy script, from a stub Elasticsearch into this
      # stack's server (and into a fake one, as in ci.yml).
      - name: Copy script smoke test (live)
        env:
          KOSHA_TEST_HOST: http://localhost:8080
          KOSHA_TEST_API_KEY: sk-kosha-dev
        run: python -m pytest scripts/tests/ -q

      - name: No legacy route was called
        run: |
          if docker compose logs --no-color kosha-server | grep -E 'status=410|legacy route usage'; then
            echo "::error::a caller used a legacy unversioned route"; exit 1
          fi

      - name: Server logs
        if: failure()
        run: docker compose logs --no-color --tail 300 kosha-server

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: conformance-report
          path: |
            conformance-report.json
            dsl-report.json
          if-no-files-found: ignore

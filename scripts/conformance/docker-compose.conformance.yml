# Overlay for the repo-root docker-compose.yml that makes segment layout
# deterministic for the conformance suite (one explicit flush = one segment),
# so the reference model can predict exact per-segment BM25 scores.
#
#   docker compose -f docker-compose.yml \
#     -f scripts/conformance/docker-compose.conformance.yml up --build -d
services:
  kosha-server:
    environment:
      KOSHA_FLUSH_THRESHOLD: "1000000"
      KOSHA_MAX_CONCURRENT_FLUSH_WRITERS: "1"
      # The compacted checkpoint calls /v1/admin/compact-namespace, which
      # needs the dedicated admin credential (#263). Dev-only value.
      KOSHA_ADMIN_API_KEY: sk-kosha-admin-dev

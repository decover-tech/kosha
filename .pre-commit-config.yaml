# Install with: pre-commit install
# See https://pre-commit.com for usage.
#
# `default_install_hook_types` ensures `pre-commit install` also wires up the
# `prepare-commit-msg` hook used by `kosha-bench-commit-msg` below (which
# appends the segment_memory cold/warm latency section to each commit). Older
# clones installed before this option was added need a one-time:
#   pre-commit install --hook-type prepare-commit-msg
default_install_hook_types: [pre-commit, prepare-commit-msg]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
      - id: mixed-line-ending

  # Rust gates run against the local toolchain (rustup stable, pinned via
  # rust-toolchain.toml). These match the CI gates exactly.
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --all -- --check
        language: system
        types: [rust]
        pass_filenames: false
      - id: cargo-clippy
        name: cargo clippy
        entry: cargo clippy --all-targets --all-features -- -D warnings
        language: system
        types: [rust]
        pass_filenames: false

      # Appends a `---kosha-bench---` section with the current cold + warm
      # latency from the segment_memory microbench to the commit message
      # before it is sealed. See scripts/commit_bench_section.sh. Mirrored by
      # .github/workflows/pre-commit.yml (which amends the same section onto
      # the PR head commit). Never blocks the commit on a bench failure.
      #
      # No `pass_filenames: false` here, unlike the Rust hooks above: for a
      # `prepare-commit-msg`-stage hook, the "filename" pre-commit appends is
      # the commit-message file path itself (git's native hook argument),
      # not a list of changed source files. Setting `pass_filenames: false`
      # (copy-pasted from cargo-fmt/cargo-clippy above, where it correctly
      # suppresses per-file args) instead starves `commit_bench_section.sh
      # hook` of the one argument it requires, so every commit failed with
      # "hook: missing message file path" — reproduced and confirmed fixed
      # by this removal.
      - id: kosha-bench-commit-msg
        name: append segment_memory cold/warm latency section to commit message
        entry: scripts/commit_bench_section.sh hook
        language: system
        stages: [prepare-commit-msg]
        always_run: true
        minimum_pre_commit_version: "3.2.0"

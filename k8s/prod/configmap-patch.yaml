# Bucket name follows the same {name_prefix}-kosha-segments convention
# confirmed live on staging (decoverai-stage-kosha-segments) — NOT
# independently verified against the prod cluster (this session's AWS
# credentials only reach the nonprod account). Confirm before first deploy.
apiVersion: v1
kind: ConfigMap
metadata:
  name: kosha-config
  namespace: kosha
data:
  KOSHA_S3_BUCKET: decoverai-prod-kosha-segments
  KOSHA_S3_PREFIX: segments/
  AWS_DEFAULT_REGION: us-east-1

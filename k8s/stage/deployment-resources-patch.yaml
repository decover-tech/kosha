# Staging needs a warm working set large enough for OpenSearch→Kosha
# catch-up and segment hydration. The base 4Gi memory OOMs after the first
# restart once manifests are loaded; keep prod on the conservative base
# until it is sized separately.
#
# Bumped again after concurrent segment hydration exceeded 32Gi under load
# on a node too small to grant the difference (see infra repo #67/#68 —
# the kosha Karpenter pool now targets i4i.2xlarge+ instead of i4i.large, so
# a node can actually back this limit instead of the pod getting evicted at
# the node-memory level before its own cgroup limit ever mattered).
# ephemeral-storage/cpu raised to match: hydration writes segment files to
# the container filesystem transiently before they land in the NVMe cache
# (see kosha-cache), and fan-out hydration (KOSHA_HYDRATE_CONCURRENCY) is
# CPU-bound during concurrent segment parsing.
#
# Cache capacity is no longer sized here: the cache is a hostPath on the
# kosha pool's NVMe instance store (see base/deployment.yaml), so its size
# is the node's instance-store size, not a pod-level sizeLimit. Only the
# container filesystem counts against ephemeral-storage.
#
# imagePullPolicy: base/deployment.yaml uses IfNotPresent, which is correct
# for prod's immutable v* tags but actively wrong for staging's floating
# :main tag — kubelet only checks whether an image with that literal tag
# *string* is already cached on the node, with no idea the registry-side
# :main now points at a different digest. That silently reused a stale
# pre-fix image across at least two deploys here (once diagnosed via a live
# kubectl patch that this file never captured, so it kept recurring on the
# next redeploy). Always for staging; leave prod on IfNotPresent.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kosha
  namespace: kosha
spec:
  template:
    spec:
      containers:
        - name: kosha
          imagePullPolicy: Always
          resources:
            requests:
              cpu: "1"
              ephemeral-storage: "5Gi"
              memory: "40Gi"
            limits:
              cpu: "7"
              ephemeral-storage: "100Gi"
              memory: "56Gi"

# GENERATED FILE — do not edit by hand.
# Source of truth: scripts/copy_es_to_kosha.py
# Regenerate with: make migration-job-manifest
#
# One-shot backfill: copies every backend search index from the staging
# OpenSearch domain into the staging Kosha deployment (DESIGN.md §14).
# Apply manually, NOT via the kustomize overlay:
#   kubectl apply -f k8s/stage/es-to-kosha-migration-job.yaml
#   kubectl logs -n kosha -f job/es-to-kosha-migration
# Re-running is safe: doc ids are preserved, so re-copied docs upsert in place.
apiVersion: v1
kind: ConfigMap
metadata:
  name: es-to-kosha-migration-script
  namespace: kosha
  labels:
    app: es-to-kosha-migration
    app.kubernetes.io/part-of: kosha
data:
  copy_es_to_kosha.py: |
    #!/usr/bin/env python3
    """Copy all chunks and embeddings from ElasticSearch/OpenSearch into Kosha.

    One-time backfill task for the ES → Kosha migration (DESIGN.md §14): scrolls
    one or more ES indices (the paragraph/chunk indices that carry ``content`` +
    ``contentEmbedding``) and replays every document through Kosha's index API.

    Index names map 1:1 to Kosha namespaces — Sage already resolves per-org/matter
    index names through ``IndexRegistry`` and uses the same string as the Kosha
    namespace, so copying under the original name keeps the read path unchanged.

    Stdlib-only, so it can run from a bare ``python:3.x-slim`` container (e.g. the
    k8s migration Job under ``k8s/stage/``). Auth mirrors the backend's
    ``connection_factory``: HTTP basic (default) or AWS SigV4
    (``ELASTICSEARCH_AUTH_MODE=sigv4``, service name "es") — SigV4 needs
    ``boto3``/``botocore`` installed and credentials resolvable from the
    environment (IRSA, node instance profile, ...).

    Usage:
        # Everything matching the staging paragraph index + custom per-matter ones
        python scripts/copy_es_to_kosha.py --pattern 'paragraph_index*'

        # One index, capped, into a different namespace (smoke test)
        python scripts/copy_es_to_kosha.py \
            --index paragraph_index_hnsw --namespace smoke-test --limit 100

        # Count what would move, write nothing
        python scripts/copy_es_to_kosha.py --pattern 'paragraph_index*' --dry-run

    Env:
        ELASTICSEARCH_HOST       http(s)://host[:port] — may embed user:pass@
                                 (default http://localhost:9200)
        ELASTICSEARCH_USERNAME   basic-auth user (overrides URL userinfo)
        ELASTICSEARCH_PASSWORD   basic-auth password
        ELASTICSEARCH_AUTH_MODE  "basic" (default) or "sigv4"
        AWS_REGION / AWS_DEFAULT_REGION  SigV4 region (default us-east-1)
        KOSHA_HOST               default http://localhost:8080
        KOSHA_API_KEY            sent as ``Authorization: Bearer ...`` when set
        PARAGRAPH_INDEX          default index when neither --index nor --pattern
                                 is given (default "paragraph_index")
    """

    from __future__ import annotations

    import argparse
    import base64
    import json
    import logging
    import os
    import sys
    import time
    import urllib.error
    import urllib.parse
    import urllib.request

    logger = logging.getLogger("copy_es_to_kosha")

    DEFAULT_ES_HOST = "http://localhost:9200"
    DEFAULT_KOSHA_HOST = "http://localhost:8080"
    DEFAULT_EMBEDDING_FIELD = "contentEmbedding"

    # Mirror of KoshaClient._MIN_VECTOR_DIM — below this, a numeric list is an
    # incidental tuple (coordinates, bounding boxes, ...), not an embedding, and
    # must not go into the shared Vector store. Keep in sync with
    # clients/python/kosha_client/client.py.
    _MIN_VECTOR_DIM = 8


    # ─── ElasticSearch: just enough of the API to bulk-read indices ─────────────


    class EsScrollClient:
        """Just enough of the ES API to bulk-read indices: _cat, _count, scroll.

        Auth mirrors the backend's connection_factory: HTTP basic (default) or
        AWS SigV4 (``ELASTICSEARCH_AUTH_MODE=sigv4``, service name "es").
        """

        def __init__(
            self,
            host: str,
            username: str | None,
            password: str | None,
            auth_mode: str = "basic",
            region: str = "us-east-1",
            timeout: int = 60,
        ) -> None:
            # Credentials may be embedded in the URL (user:pass@host); explicit
            # username/password args win. Strip userinfo from the base URL either
            # way so nothing sensitive leaks into logs/CanonicalRequests.
            parsed = urllib.parse.urlsplit(host)
            if parsed.username and username is None:
                username = urllib.parse.unquote(parsed.username)
                password = urllib.parse.unquote(parsed.password or "")
            netloc = parsed.hostname or "localhost"
            if parsed.port:
                netloc += f":{parsed.port}"
            self._base = urllib.parse.urlunsplit((parsed.scheme or "http", netloc, parsed.path.rstrip("/"), "", ""))

            self._auth_mode = (auth_mode or "basic").lower()
            self._timeout = timeout
            self._signer = None

            if self._auth_mode == "sigv4":
                try:
                    import boto3
                    from botocore.auth import SigV4Auth
                    from botocore.awsrequest import AWSRequest
                except ImportError as exc:
                    raise RuntimeError(
                        "ELASTICSEARCH_AUTH_MODE=sigv4 requires boto3/botocore — "
                        "run from an environment that has them installed."
                    ) from exc
                creds = boto3.Session().get_credentials()
                if creds is None:
                    raise RuntimeError(
                        "ELASTICSEARCH_AUTH_MODE=sigv4 but no AWS credentials available."
                    )
                self._frozen_creds = creds.get_frozen_credentials()
                self._sigv4 = SigV4Auth
                self._aws_request = AWSRequest
                self._region = region
            else:
                self._basic_header = None
                if username is not None:
                    token = base64.b64encode(f"{username}:{password or ''}".encode()).decode()
                    self._basic_header = "Basic " + token

        def _request(self, method: str, path: str, body: dict | None = None) -> dict:
            url = self._base + path
            data = json.dumps(body).encode() if body is not None else None
            headers = {"Content-Type": "application/json"}
            if self._auth_mode == "sigv4":
                req = self._aws_request(method=method, url=url, data=data or b"", headers=headers)
                self._sigv4(self._frozen_creds, "es", self._region).add_auth(req)
                headers = dict(req.headers)
            elif self._basic_header:
                headers["Authorization"] = self._basic_header
            req = urllib.request.Request(url, data=data, headers=headers, method=method)
            try:
                with urllib.request.urlopen(req, timeout=self._timeout) as resp:
                    return json.loads(resp.read().decode())
            except urllib.error.HTTPError as e:
                detail = e.read().decode()[:500]
                raise RuntimeError(f"ES {method} {path} → {e.code}: {detail}") from e

        def list_indices(self, pattern: str) -> list[str]:
            """Resolve an index pattern to concrete, non-system index names."""
            rows = self._request("GET", f"/_cat/indices/{urllib.parse.quote(pattern, safe='*')}?format=json")
            names = [row["index"] for row in rows if not row.get("index", ".").startswith(".")]
            return sorted(set(names))

        def count(self, index: str, query: dict | None = None) -> int:
            body = {"query": query} if query else None
            result = self._request("POST", f"/{urllib.parse.quote(index)}/_count", body)
            return int(result.get("count", 0))

        def open_scroll(self, index: str, size: int, keepalive: str) -> tuple[str, list, int]:
            body = {
                "size": size,
                "sort": ["_doc"],
                "track_total_hits": True,
                "query": {"match_all": {}},
            }
            result = self._request(
                "POST", f"/{urllib.parse.quote(index)}/_search?scroll={keepalive}", body
            )
            hits = result.get("hits", {})
            total = hits.get("total", {})
            total_value = total.get("value", 0) if isinstance(total, dict) else int(total)
            return result["_scroll_id"], hits.get("hits", []), total_value

        def next_scroll(self, scroll_id: str, keepalive: str) -> tuple[str, list]:
            result = self._request(
                "POST", "/_search/scroll", {"scroll_id": scroll_id, "scroll": keepalive}
            )
            return result.get("_scroll_id", scroll_id), result.get("hits", {}).get("hits", [])

        def clear_scroll(self, scroll_id: str) -> None:
            try:
                self._request("DELETE", "/_search/scroll", {"scroll_id": [scroll_id]})
            except Exception as exc:  # best-effort — a leaked scroll expires anyway
                logger.warning("failed to clear scroll: %s", exc)


    # ─── Kosha: batched writes to the legacy Phase 1 routes ─────────────────────


    class KoshaWriter:
        def __init__(self, host: str, api_key: str | None, timeout: int = 300) -> None:
            self._base = host.rstrip("/")
            self._api_key = api_key
            self._timeout = timeout

        def _request(self, method: str, path: str, body: dict | None = None) -> dict:
            data = json.dumps(body).encode() if body is not None else None
            headers = {"Content-Type": "application/json"}
            if self._api_key:
                headers["Authorization"] = f"Bearer {self._api_key}"
            req = urllib.request.Request(self._base + path, data=data, headers=headers, method=method)
            try:
                with urllib.request.urlopen(req, timeout=self._timeout) as resp:
                    return json.loads(resp.read().decode() or "{}")
            except urllib.error.HTTPError as e:
                detail = e.read().decode()[:500]
                raise RuntimeError(f"Kosha {method} {path} → {e.code}: {detail}") from e

        def index_batch(self, namespace: str, documents: list[dict]) -> int:
            result = self._request(
                "POST", "/index", {"namespace": namespace, "documents": documents}
            )
            return int(result.get("indexed_count", len(documents)))

        def flush(self, namespace: str) -> None:
            self._request("POST", "/flush", {"namespace": namespace})


    # ─── Field conversion — keep in sync with KoshaClient._source_to_fields ─────


    def _field(name: str, value: str, field_type: str) -> dict:
        return {"name": name, "field_type": field_type, "value": value}


    def source_to_fields(source: dict) -> list[dict]:
        """Convert an ES ``_source`` doc into Kosha fields.

        Identical mapping to the Python client so backfilled docs are
        indistinguishable from docs written through ``KoshaClient.index``:
        str → Text, bool → Boolean, int/float → Float, numeric list (len ≥
        _MIN_VECTOR_DIM) → Vector, any other list → Keyword (JSON), dicts and
        other types are skipped.
        """
        fields: list[dict] = []
        for k, v in source.items():
            if k.startswith("__type__"):
                continue
            if isinstance(v, str):
                fields.append(_field(k, v, "Text"))
            elif isinstance(v, bool):
                fields.append(_field(k, str(v).lower(), "Boolean"))
            elif isinstance(v, (int, float)):
                fields.append(_field(k, str(v), "Float"))
            elif (
                isinstance(v, (list, tuple))
                and len(v) >= _MIN_VECTOR_DIM
                and all(isinstance(x, (int, float)) and not isinstance(x, bool) for x in v)
            ):
                fields.append(_field(k, json.dumps(list(v)), "Vector"))
            elif isinstance(v, (list, tuple)):
                fields.append(_field(k, json.dumps(list(v), default=str), "Keyword"))
            # else: unsupported type (dict, None, ...) — skip silently, same as
            # the client.
        return fields


    # ─── Copy driver ─────────────────────────────────────────────────────────────


    def resolve_indices(es: EsScrollClient, args: argparse.Namespace) -> list[str]:
        """Concrete list of ES indices to copy, in stable order, de-duplicated."""
        indices: list[str] = []
        for pattern in args.pattern or []:
            matched = es.list_indices(pattern)
            if not matched:
                logger.warning("pattern %r matched no indices — skipping", pattern)
            indices.extend(matched)
        indices.extend(args.index or [])
        if not indices and not args.index and not args.pattern:
            indices.append(os.environ.get("PARAGRAPH_INDEX") or "paragraph_index")
        if not indices:
            raise RuntimeError("no indices matched — nothing to copy")
        # De-dupe, keep stable order.
        seen: set[str] = set()
        out: list[str] = []
        for name in indices:
            if name not in seen:
                seen.add(name)
                out.append(name)
        return out


    def copy_index(
        es: EsScrollClient,
        kosha: KoshaWriter,
        index: str,
        namespace: str,
        args: argparse.Namespace,
    ) -> tuple[int, int]:
        """Scroll one ES index and index every doc into a Kosha namespace.

        Returns (docs_copied, docs_with_embedding).
        """
        total = es.count(index)
        planned = min(total, args.limit) if args.limit else total
        scope = f"capped by --limit from {total}" if args.limit and args.limit < total else "full index"
        logger.info("index %s → namespace %s: %s docs (%s)", index, namespace, planned, scope)

        copied = 0
        with_embedding = 0
        batch: list[dict] = []

        def _send_batch() -> None:
            if not batch:
                return
            kosha.index_batch(namespace, batch)
            batch.clear()
            if args.sleep > 0:
                time.sleep(args.sleep)

        scroll_id, hits, _ = es.open_scroll(index, args.scroll_size, args.scroll_keepalive)
        try:
            while True:
                for hit in hits:
                    if args.limit and copied >= args.limit:
                        break
                    doc_id = hit.get("_id")
                    if not doc_id:
                        logger.warning("hit without _id in %s — skipping", index)
                        continue
                    source = hit.get("_source") or {}
                    if args.embedding_field in source:
                        with_embedding += 1
                    batch.append({"id": doc_id, "fields": source_to_fields(source)})
                    copied += 1
                    if len(batch) >= args.batch_size:
                        _send_batch()
                        logger.info("index %s: %s / %s docs copied", index, copied, planned)
                if args.limit and copied >= args.limit:
                    break
                if not hits:
                    break
                scroll_id, hits = es.next_scroll(scroll_id, args.scroll_keepalive)
                if not hits:
                    break
        finally:
            es.clear_scroll(scroll_id)

        _send_batch()
        if copied > 0:
            kosha.flush(namespace)
        logger.info(
            "index %s: %s namespace %s — %s docs copied, %s with %s",
            index, "flushed" if copied else "skipped (empty)", namespace,
            copied, with_embedding, args.embedding_field,
        )
        return copied, with_embedding


    def dry_run(es: EsScrollClient, indices: list[str], args: argparse.Namespace) -> None:
        print("\n Dry-run — no writes to Kosha:\n")
        grand_total = 0
        for index in indices:
            total = es.count(index)
            with_emb = es.count(index, {"exists": {"field": args.embedding_field}})
            planned = min(total, args.limit) if args.limit else total
            grand_total += planned
            print(f"  {index:<48}{planned:>12,} docs   ({with_emb:>12,} with {args.embedding_field})")
        print(f"  {'TOTAL':<48}{grand_total:>12,} docs\n")


    def main(argv: list[str] | None = None) -> int:
        parser = argparse.ArgumentParser(
            description="Copy chunks + embeddings from ElasticSearch/OpenSearch into Kosha."
        )
        parser.add_argument("--index", action="append",
                            help="Concrete ES index to copy (repeatable).")
        parser.add_argument("--pattern", action="append",
                            help="ES index pattern resolved via _cat/indices (repeatable).")
        parser.add_argument("--namespace",
                            help="Kosha namespace override (only valid with a single --index).")
        parser.add_argument("--limit", type=int,
                            help="Max docs per index (smoke tests).")
        parser.add_argument("--batch-size", type=int, default=200,
                            help="Docs per Kosha /index call (default 200).")
        parser.add_argument("--scroll-size", type=int, default=1000,
                            help="ES scroll page size (default 1000).")
        parser.add_argument("--scroll-keepalive", default="5m",
                            help="ES scroll context keepalive (default 5m).")
        parser.add_argument("--sleep", type=float, default=0.0,
                            help="Seconds to sleep between batches (throttle, default 0).")
        parser.add_argument("--embedding-field", default=DEFAULT_EMBEDDING_FIELD,
                            help=f"Embedding field name for stats (default {DEFAULT_EMBEDDING_FIELD}).")
        parser.add_argument("--timeout", type=int, default=120,
                            help="Per-request timeout in seconds (default 120).")
        parser.add_argument("--dry-run", action="store_true",
                            help="Count docs per index, write nothing.")
        parser.add_argument("--verbose", action="store_true")
        args = parser.parse_args(argv)

        logging.basicConfig(
            level=logging.DEBUG if args.verbose else logging.INFO,
            format="%(asctime)s %(levelname)s %(message)s",
        )

        es = EsScrollClient(
            host=os.environ.get("ELASTICSEARCH_HOST", DEFAULT_ES_HOST),
            username=os.environ.get("ELASTICSEARCH_USERNAME"),
            password=os.environ.get("ELASTICSEARCH_PASSWORD"),
            auth_mode=os.environ.get("ELASTICSEARCH_AUTH_MODE", "basic"),
            region=os.environ.get("AWS_REGION") or os.environ.get("AWS_DEFAULT_REGION") or "us-east-1",
            timeout=args.timeout,
        )

        indices = resolve_indices(es, args)
        if args.namespace and len(indices) != 1:
            parser.error("--namespace is only valid when exactly one index is being copied")

        if args.dry_run:
            dry_run(es, indices, args)
            return 0

        kosha = KoshaWriter(
            host=os.environ.get("KOSHA_HOST", DEFAULT_KOSHA_HOST),
            api_key=os.environ.get("KOSHA_API_KEY"),
            timeout=max(args.timeout, 300),
        )

        grand_copied = 0
        grand_embeddings = 0
        for index in indices:
            namespace = args.namespace or index
            copied, with_emb = copy_index(es, kosha, index, namespace, args)
            grand_copied += copied
            grand_embeddings += with_emb

        logger.info(
            "done: %s docs copied (%s with %s) across %s indices",
            grand_copied, grand_embeddings, args.embedding_field, len(indices),
        )
        return 0


    if __name__ == "__main__":
        sys.exit(main())
---
apiVersion: batch/v1
kind: Job
metadata:
  name: es-to-kosha-migration
  namespace: kosha
  labels:
    app: es-to-kosha-migration
    app.kubernetes.io/part-of: kosha
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 86400 # keep the finished pod around 24h for logs
  # Generous ceiling so a wedged scroll can't run forever. Raise (or delete)
  # for a very large corpus.
  activeDeadlineSeconds: 21600 # 6h
  template:
    metadata:
      labels:
        app: es-to-kosha-migration
    spec:
      restartPolicy: Never
      # Deliberately NO serviceAccountName: the default SA has no IRSA, so
      # boto3 falls back to the EC2 node instance profile — the same AWS
      # identity the backend pods (sage/celery) use today when they SigV4 to
      # the staging OpenSearch domain. The kosha SA's IRSA role is NOT known
      # to have es:ESHttp* — do not use it here.
      containers:
        - name: migrate
          image: python:3.12-slim
          env:
            - name: ELASTICSEARCH_HOST
              value: "https://vpc-decoverai-nonprod-search-rdaf2ygjik3teui5prmuotjlx4.us-east-1.es.amazonaws.com"
            - name: ELASTICSEARCH_AUTH_MODE
              value: "sigv4"
            - name: AWS_REGION
              value: "us-east-1"
            - name: AWS_DEFAULT_REGION
              value: "us-east-1"
            - name: KOSHA_HOST
              value: "http://kosha-service.kosha.svc.cluster.local:8080"
            - name: KOSHA_API_KEY
              valueFrom:
                secretKeyRef:
                  name: kosha-secret
                  key: bootstrap-api-key
          command:
            - /bin/sh
            - -c
            - |
              set -e
              # boto3/botocore for SigV4 signing against the managed ES domain
              # (requires NAT egress to PyPI, which the staging cluster has).
              pip install --quiet --disable-pip-version-check boto3
              exec python /scripts/copy_es_to_kosha.py --pattern 'paragraph_index*' --pattern 'page_index*' --pattern 'findings_index*' --pattern 'document_index*' --pattern 'completions_index*' --pattern 'cases_index*' --batch-size 200 --scroll-size 1000
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "2Gi"
          volumeMounts:
            - name: script
              mountPath: /scripts
              readOnly: true
      volumes:
        - name: script
          configMap:
            name: es-to-kosha-migration-script


# Starting point for the query tier's per-pod sizing — validate against a
# real concurrent-search load test rather than treating these as final.
# Once search-only CPU contention is spread across N pods instead of all
# fighting for one pod's rayon thread pool, per-pod CPU can be smaller while
# aggregate throughput goes up.
#
# Memory bumped 4Gi/8Gi -> 8Gi/16Gi after the first load test OOMKilled a
# query pod (exit 137). Root cause: KOSHA_SEGMENT_CACHE_MAX_BYTES is a
# ConfigMap-wide value (40GiB) sized for the old single ingest pod's 56Gi
# limit — inherited as-is by the much smaller query pods, so the in-process
# cache had no reason to evict before the *container* cgroup limit killed
# it. Measured directly against the ingest pod (56Gi headroom, so safe to
# observe): one cold /search hydrating paragraph_index_hnsw's full 258
# segments alone costs ~6.5GiB RSS. 8Gi left ~1.5GiB for everything else
# (process baseline, other namespaces' cached segments, per-request
# working memory under concurrency) — not enough margin.
#
# The cache budget alone then proved insufficient under *concurrent* broad
# queries: the cache bounds idle memory, but segments pinned by in-flight
# requests' Arc references are unevictable, so N overlapping full-namespace
# searches could pin N × cache-budget of real memory past any configured
# number (pods kept OOMKilling at 16Gi, needed an emergency live bump to
# 24Gi). The durable fix is the live-bytes admission gate in kosha-query
# (`MemoryLedger`): KOSHA_SEGMENT_LIVE_MAX_BYTES below caps cache-resident
# + request-pinned segment memory together, queueing (then 429-shedding)
# searches that would exceed it — so 16Gi is enough again and the 24Gi
# emergency value is deliberately NOT carried forward.
#
# imagePullPolicy: Always for the same reason as deployment-resources-patch.yaml
# — staging's floating :main tag means kubelet's tag-based image cache check
# is not enough; this Deployment shares that same image reference.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kosha-query
  namespace: kosha
spec:
  template:
    spec:
      containers:
        - name: kosha
          imagePullPolicy: Always
          env:
            # Overrides the ConfigMap's 40GiB value (see comment above) —
            # explicit container env wins over envFrom on key collision.
            # ~10GiB leaves ~6GiB of the 16Gi limit for process baseline +
            # concurrent per-request working memory, so the cache evicts
            # gracefully instead of the pod getting OOMKilled.
            - name: KOSHA_SEGMENT_CACHE_MAX_BYTES
              value: "10737418240"
            # Live-bytes watermark (cache-resident + pinned by in-flight
            # searches — see kosha_query::MemoryLedger). Must be set
            # explicitly here: the code default is 2× the cache budget
            # (20GiB), which exceeds the 16Gi container limit. 12GiB leaves
            # ~4GiB of the limit for process baseline + working memory of
            # the (KOSHA_MAX_CONCURRENT_SEARCHES, default 8) concurrent
            # scoring passes.
            - name: KOSHA_SEGMENT_LIVE_MAX_BYTES
              value: "12884901888"
          resources:
            requests:
              cpu: "2"
              ephemeral-storage: "5Gi"
              memory: "8Gi"
            limits:
              cpu: "4"
              ephemeral-storage: "20Gi"
              memory: "16Gi"

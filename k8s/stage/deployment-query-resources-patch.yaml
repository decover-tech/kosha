# Starting point for the query tier's per-pod sizing — validate against a
# real concurrent-search load test rather than treating these as final.
# Once search-only CPU contention is spread across N pods instead of all
# fighting for one pod's rayon thread pool, per-pod CPU can be smaller while
# aggregate throughput goes up.
#
# Memory bumped 4Gi/8Gi -> 8Gi/16Gi after the first load test OOMKilled a
# query pod (exit 137). Root cause: KOSHA_SEGMENT_CACHE_MAX_BYTES is a
# ConfigMap-wide value (40GiB) sized for the old single ingest pod's 56Gi
# limit — inherited as-is by the much smaller query pods, so the in-process
# cache had no reason to evict before the *container* cgroup limit killed
# it. Measured directly against the ingest pod (56Gi headroom, so safe to
# observe): one cold /search hydrating paragraph_index_hnsw's full 258
# segments alone costs ~6.5GiB RSS. 8Gi left ~1.5GiB for everything else
# (process baseline, other namespaces' cached segments, per-request
# working memory under concurrency) — not enough margin.
#
# The cache budget alone then proved insufficient under *concurrent* broad
# queries: the cache bounds idle memory, but segments pinned by in-flight
# requests' Arc references are unevictable, so N overlapping full-namespace
# searches could pin N × cache-budget of real memory past any configured
# number (pods kept OOMKilling at 16Gi, needed an emergency live bump to
# 24Gi). The durable fix is the live-bytes admission gate in kosha-query
# (`MemoryLedger`): KOSHA_SEGMENT_LIVE_MAX_BYTES below caps cache-resident
# + request-pinned segment memory together, queueing (then 429-shedding)
# searches that would exceed it — so 16Gi is enough again and the 24Gi
# emergency value is deliberately NOT carried forward.
#
# imagePullPolicy: Always for the same reason as deployment-resources-patch.yaml
# — staging's floating :main tag means kubelet's tag-based image cache check
# is not enough; this Deployment shares that same image reference.
#
# KOSHA_CACHE_MAX_BYTES added after a separate incident: this Deployment's
# on-disk segment cache is an emptyDir (base/deployment-query.yaml — unlike
# the ingest Deployment's hostPath NVMe volume, which the kubelet does NOT
# count against ephemeral-storage). Left unset, that cache is unbounded, so
# it — not KOSHA_SEGMENT_CACHE_MAX_BYTES above, which only bounds the
# in-memory parsed-segment cache — is what actually consumes the pod's
# ephemeral-storage limit.
#
# 2026-08-17: doubled straight through (memory, ephemeral-storage, and both
# cache-budget env vars together) after this exact "ephemeral local storage
# usage exceeds the total limit of containers 20Gi" eviction reproduced live
# — a cold pod hydrating paragraph_index_hnsw's full 88 segments (22,758
# files) filled the on-disk cache past the then-current 20Gi ephemeral-
# storage limit and got Kubernetes-Evicted, same failure mode as the
# original 10M-doc benchmark this comment already documented. Root cause of
# it recurring: an earlier live memory bump (16Gi -> 32Gi, to clear a
# concurrent OOMKill) only doubled KOSHA_SEGMENT_CACHE_MAX_BYTES/
# KOSHA_SEGMENT_LIVE_MAX_BYTES (RAM-bounding) and KOSHA_CACHE_MAX_BYTES
# (disk-bounding) together, but not the container's own ephemeral-storage
# limit — so the disk cache budget (24Gi) ended up exceeding the still-20Gi
# hard limit, guaranteeing eviction once the cache filled. Doubling
# ephemeral-storage alongside the rest preserves the same ~40%-headroom
# ratio the original sizing established (24Gi cache budget / 40Gi limit =
# 60% used, matching 12Gi/20Gi before) rather than just raising one knob and
# leaving the others to drift out of proportion again.
#
# 2026-11: the two paragraphs above describe the emptyDir cache, which this
# patch has since replaced with a per-pod EBS volume (volumes at the end).
# The disk cache is now bounded by that volume (100Gi) and
# KOSHA_CACHE_MAX_BYTES (64GiB), not by ephemeral-storage, so a full cache
# can no longer evict the pod or fill the node's root disk.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kosha-query
  namespace: kosha
spec:
  template:
    spec:
      containers:
        - name: kosha
          imagePullPolicy: Always
          env:
            # Overrides the ConfigMap's 40GiB value (see comment above) —
            # explicit container env wins over envFrom on key collision.
            # 16GiB (SC). The idle parsed-segment cache and the decoded
            # vector postings cache (C = 4GiB, below) both count toward the
            # live watermark (W = 20GiB, below). At SC 20 + C 4 = 24 > W the
            # idle caches alone exceeded W: the segment cache never evicted
            # on its own and every loading search fell into the synchronous
            # admission-path eviction. SC 16 + C 4 = 20 = W fits; the RAM
            # bound W + C = 24GiB of the 32Gi limit is unchanged. Cost: 4GiB
            # less room for parsed segments.
            - name: KOSHA_SEGMENT_CACHE_MAX_BYTES
              value: "17179869184"
            # 64 GiB on the pod's own 100 GiB EBS volume (see volumes
            # below): two matters' segments no longer fit in 24 GiB, so the
            # cache evicted continuously. The headroom covers files pinned
            # by in-flight searches, which may take the cache past this cap.
            - name: KOSHA_CACHE_MAX_BYTES
              value: "68719476736"
            # Live-bytes watermark W (cache-resident + pinned by in-flight
            # searches + decoded postings — see kosha_query::MemoryLedger).
            # Must be set explicitly here: the code default is 2× the cache
            # budget (32GiB), which is the whole 32Gi container limit.
            # 20GiB, not 24GiB, because decoded vector postings (C below)
            # inserted after a search is admitted are not reserved by the
            # ledger, so live can pass W by up to C: worst case
            # W + C = 20 + 4 = 24GiB of the 32Gi limit, leaving ~8GiB for
            # process baseline + working memory of the
            # (KOSHA_MAX_CONCURRENT_SEARCHES, default 8) concurrent scoring
            # passes. Unrelated to KOSHA_CACHE_MAX_BYTES above, which bounds
            # disk (the EBS cache volume); this one bounds RAM.
            - name: KOSHA_SEGMENT_LIVE_MAX_BYTES
              value: "21474836480"
            # Decoded vector postings C: one LRU for the whole process (all
            # segments together), 4GiB; counted in W above. The code default
            # is 512MiB. A posting decodes to ~435KB here, so the cache
            # holds ~4GiB / 435KB ≈ 9,870 postings, and its second-touch
            # window is the same size: one 489K-chunk query (1,610 probes,
            # ~700MB) and one 1.8M-chunk query (~5,950 probes, ~2.6GB) each
            # fit and are cached on their second run; a probe set larger
            # than the cache is not admitted (it could only churn).
            - name: KOSHA_VECTOR_POSTINGS_CACHE_MAX_BYTES
              value: "4294967296"
            # No KOSHA_WARMUP_NAMESPACES: Decover keeps every matter in one
            # namespace (default/paragraph_index_hnsw), so naming it made
            # each new pod load every customer's matter before /readyz,
            # whether or not anyone searched it. A new pod instead warms what
            # pods were actually searching (the usage warm set,
            # KOSHA_WARMUP_USAGE, on by default) within
            # KOSHA_WARMUP_BUDGET_BYTES below.
            # Trade-offs of dropping it: (1) the manifest refresher no longer
            # prefetches a new version's scoring set before swapping it in,
            # so the first search after a compaction pays that fetch;
            # (2) it was originally added so full-namespace match_all scans
            # (backend's catchup_es_to_kosha.py) were not shed with 429 on a
            # cold pod at the then 2 GiB per-request budget. The budget is
            # now 8 GiB (KOSHA_HYDRATE_REQUEST_MAX_BYTES below); whether such
            # a scan fits in it on a cold pod has not been re-measured.
            # Posting blobs on (the code default). They were switched off when
            # the namespace had 206,756 of them and warming held /readyz for
            # ~25 minutes; compaction has since left 256 per segment (1,536
            # files, 36 MB for a 489K-chunk matter), and without them the
            # first keyword and phrase searches on a new pod fetch them one
            # request at a time.
            - name: KOSHA_WARMUP_POSTING_BLOBS
              value: "1"
            # One search may hydrate up to 8 GiB (default 2 GiB). A compacted
            # segment's vector.idx alone is 1.6 GB and the matter's vector
            # indexes total 2.7 GB, so under the default a semantic search on
            # a cold pod was shed with a 429 every time and could never warm
            # the pod. Still under the 64 GiB disk cache budget above.
            - name: KOSHA_HYDRATE_REQUEST_MAX_BYTES
              value: "8589934592"
            # Boot warm-up keeps at most 12 GiB local; the rest is fetched on
            # demand. Unbounded, a pod warming a namespace that had grown to
            # two matters filled its node's 50 GB root disk (DiskPressure,
            # evicted, 22 replacements rejected).
            - name: KOSHA_WARMUP_BUDGET_BYTES
              value: "12G"
            # Let in-flight searches finish when a pod is removed: a cold
            # search can take 30-40 s, and the 25 s default cut them off
            # ("connection(s) still open after the 25s shutdown grace").
            # terminationGracePeriodSeconds below must stay above it.
            - name: KOSHA_HTTP_SHUTDOWN_GRACE_SECS
              value: "60"
          # ephemeral-storage no longer holds the disk cache: the cache is on
          # the pod's own EBS volume (volumes below), which the kubelet does
          # not count against this limit. It now covers only the writable
          # layer and logs. Values kept as they were; lowering them is a
          # separate change.
          resources:
            requests:
              cpu: "2"
              ephemeral-storage: "10Gi"
              memory: "16Gi"
            limits:
              cpu: "4"
              ephemeral-storage: "40Gi"
              memory: "32Gi"
      # Above KOSHA_HTTP_SHUTDOWN_GRACE_SECS (60) so the kubelet's SIGKILL
      # does not land before the server's own drain deadline; 15 s covers
      # process exit after the drain.
      terminationGracePeriodSeconds: 75
      # The image runs as uid 10001 (Dockerfile) and a new EBS volume's root
      # belongs to root, so creating the WAL dir on it failed; the volume is
      # handed to group 10001 (an emptyDir is world-writable, which hid
      # this). OnRootMismatch skips the recursive chown when the root
      # already matches, which on a fresh empty volume costs nothing.
      securityContext:
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
      # The disk cache gets its own gp3 volume, created with the pod and
      # deleted with it, instead of an emptyDir on the node's 50 GB root
      # disk: warming two matters filled that disk (DiskPressure, the pod
      # evicted, 22 replacements rejected on the same node).
      # 100Gi = KOSHA_CACHE_MAX_BYTES (64 GiB) + headroom for files pinned
      # by in-flight searches over the cap. `emptyDir: null` removes base's
      # emptyDir from this strategic-merge patch (a volume has one source).
      # The storage class is the cluster's EBS class, as in
      # scripts/eval/k8s/collector.yaml. Cost: one gp3 100 GiB volume per
      # pod (HPA 2-6 pods).
      volumes:
        - name: cache
          emptyDir: null
          ephemeral:
            volumeClaimTemplate:
              spec:
                accessModes: ["ReadWriteOnce"]
                storageClassName: decoverai-sc-ebs
                resources:
                  requests:
                    storage: 100Gi

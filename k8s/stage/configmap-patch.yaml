# Env-specific S3/region values are NOT committed here — the deploy action
# writes them at apply time from GitHub Environment secrets (see
# .github/actions/deploy-eks). Keeps this repo free of customer/account
# bucket names.
apiVersion: v1
kind: ConfigMap
metadata:
  name: kosha-config
  namespace: kosha
data:
  # Searches read only what the indexer has published, like OpenSearch's
  # refresh model. Under the default (strong) a query pod asks the ingest
  # pod for its unindexed tail, and a manifest version mismatch between
  # the two answered 503 while the 1.8M-chunk matter was compacting.
  KOSHA_DEFAULT_CONSISTENCY: "eventual"

# Env-specific S3/region values are NOT committed here — the deploy action
# writes them at apply time from GitHub Environment secrets (see
# .github/actions/deploy-eks). Keeps this repo free of customer/account
# bucket names.
#
# Legacy routes (#350, ADR-350 §c): stage no longer serves the unversioned
# Phase 1 routes; callers get 410 legacy_route_disabled naming the /v1
# replacement. List any tenant still migrating, comma-separated, in
# KOSHA_LEGACY_ROUTES_TENANTS (docs/api/versioning.md, "Legacy routes").
# Rollback: set KOSHA_LEGACY_ROUTES to "on".
#
# kNN probe ranking (DEC-3203): rank postings by raw centroid distance. On a
# real 988k-vector matter, tie-tolerant recall@10 went 0.82 -> 0.99 and server
# p50 18 -> 7 ms (612 instead of ~2,540 postings probed); legal corpora are
# near-duplicate heavy, so outlier members inflate posting radii and the
# radius-weighted default (1.0) ranks most postings as ties. See
# docs/configuration.md. Rollback: delete the key (engine default 1.0).
apiVersion: v1
kind: ConfigMap
metadata:
  name: kosha-config
  namespace: kosha
data:
  KOSHA_LEGACY_ROUTES: "off"
  KOSHA_KNN_PROBE_RADIUS_ALPHA: "0"

# The settings that are commented out in base/configmap.yaml. The paths are
# the keys of the kosha-internal-tls Secret under its mount point.
apiVersion: v1
kind: ConfigMap
metadata:
  name: kosha-config
  namespace: kosha
data:
  # Server side: HTTPS on :8080, and a client certificate required on
  # /internal/* (mTLS). Other routes, the probes included, need none.
  KOSHA_TLS_CERT_PATH: /etc/kosha/tls/tls.crt
  KOSHA_TLS_KEY_PATH: /etc/kosha/tls/tls.key
  KOSHA_TLS_CLIENT_CA_PATH: /etc/kosha/tls/ca.crt
  # Client side: peer hydration and ingest forwarding. Patch this to
  # "required" in the overlay once every pod is on TLS and DATABASE_URL
  # carries sslmode=verify-full (or verify-ca / require).
  KOSHA_INTERNAL_TLS: "on"
  KOSHA_INTERNAL_TLS_CA_PATH: /etc/kosha/tls/ca.crt
  KOSHA_INTERNAL_TLS_CLIENT_CERT_PATH: /etc/kosha/tls/tls.crt
  KOSHA_INTERNAL_TLS_CLIENT_KEY_PATH: /etc/kosha/tls/tls.key
  KOSHA_INTERNAL_TLS_SERVER_NAME: kosha-internal

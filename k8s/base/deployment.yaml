apiVersion: apps/v1
kind: Deployment
metadata:
  name: kosha
  namespace: kosha
  labels:
    app: kosha
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kosha
  template:
    metadata:
      labels:
        app: kosha
    spec:
      serviceAccountName: kosha
      containers:
        - name: kosha
          image: kosha
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
            - containerPort: 50051
              name: grpc
          envFrom:
            - configMapRef:
                name: kosha-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: kosha-secret
                  key: database-url
            - name: KOSHA_API_KEY
              valueFrom:
                secretKeyRef:
                  name: kosha-secret
                  key: bootstrap-api-key
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          volumeMounts:
            - name: cache
              mountPath: /var/cache/kosha
      volumes:
        - name: cache
          emptyDir:
            sizeLimit: "10Gi"

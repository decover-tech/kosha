apiVersion: apps/v1
kind: Deployment
metadata:
  name: kosha
  namespace: kosha
  labels:
    app: kosha
    role: ingest
spec:
  replicas: 1
  # selector.matchLabels is immutable post-creation — kept as the original
  # bare `app: kosha` so this change stays purely additive. `role: ingest`
  # only needs to exist on the pod template (a superset of the selector is
  # allowed) for kosha-ingest-service to pick it up.
  selector:
    matchLabels:
      app: kosha
  # The cache lives on the node's instance store (hostPath, below), so two
  # kosha pods must never share a node — a rolling update's surge pod would
  # write the same host directory as the outgoing pod. Recreate trades a few
  # seconds of downtime for that guarantee; already a single replica anyway.
  # This pod is the single, pinned write target — see deployment-query.yaml
  # for the horizontally-scaled, stateless read tier and main.rs's request
  # forwarding for how writes always land here regardless of which pod a
  # client's request first reaches.
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: kosha
        role: ingest
    spec:
      serviceAccountName: kosha
      # Land only on the Karpenter-managed kosha NVMe pool. The label is
      # unique to that pool; the taint keeps everything else off it.
      nodeSelector:
        kosha.dev/instance-store: nvme
      tolerations:
        - key: dedicated
          operator: Equal
          value: kosha
          effect: NoSchedule
      containers:
        - name: kosha
          image: kosha
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
            - containerPort: 50051
              name: grpc
          envFrom:
            - configMapRef:
                name: kosha-config
          env:
            - name: KOSHA_ROLE
              value: ingest
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: kosha-secret
                  key: database-url
            - name: KOSHA_API_KEY
              valueFrom:
                secretKeyRef:
                  name: kosha-secret
                  key: bootstrap-api-key
            # Admin routes on this pod are synchronous and long:
            # /v1/admin/compact-namespace hydrates the entire namespace
            # (22.35GiB for staging's paragraph_index_hnsw, vectors
            # included) and merges it inside the request. The default is
            # 300s, so such a call answers into a dead socket while the
            # work continues server-side, leaving the caller with no way to
            # tell success from failure. This is a per-syscall read/write
            # budget, not a request deadline (see the comment where it is
            # parsed), so raising it costs nothing for normal traffic — it
            # only stops a slow handler's response from being unsendable.
            # 1800 matches what deployment-query.yaml already carries.
            - name: KOSHA_HTTP_IO_TIMEOUT_SECS
              value: "1800"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          # Cold start is dominated by the control-plane restore, which reads
          # every segment ref for every namespace out of S3 before the server
          # binds :8080. On 2026-08-29 the staging ingest pod was rescheduled
          # onto a fresh r5dn node, so the instance-store hostPath cache was
          # empty; the restore then took 93-101s (3,280 segment refs, ~126MB
          # pulled from S3) while liveness — initialDelay 15s, period 20s,
          # failureThreshold 3 — killed the container at ~55-75s. Nothing was
          # listening yet, so every probe got "connection refused" and the pod
          # crashlooped 127 times over 8h with kosha-ingest-service holding
          # zero endpoints. A startupProbe is the fix: liveness and readiness
          # stay suspended until it first succeeds, so a cold restore gets a
          # 600s budget while a warm one still goes ready in ~10s. The budget
          # scales with segment count, so keep it generous.
          startupProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 10
            failureThreshold: 60
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            # ephemeral-storage now only covers the container filesystem
            # (logs, /tmp) — the segment cache is on the instance-store
            # hostPath, which the kubelet does not account for. Large
            # ephemeral-storage requests here would only constrain
            # scheduling against the node's small root EBS volume.
            requests:
              memory: "512Mi"
              cpu: "250m"
              ephemeral-storage: "1Gi"
            limits:
              memory: "4Gi"
              cpu: "2"
              ephemeral-storage: "8Gi"
          volumeMounts:
            - name: cache
              mountPath: /var/cache/kosha
      volumes:
        # The node's user-data (EC2NodeClass) formats and mounts the NVMe
        # instance store at this exact path. Data here is a cache: it is
        # rebuildable from the Postgres manifest + S3 segments, and is lost
        # when the node is replaced.
        - name: cache
          hostPath:
            path: /var/lib/kosha-cache
            type: DirectoryOrCreate

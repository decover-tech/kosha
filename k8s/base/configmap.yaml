# Env-agnostic defaults. S3/region settings (KOSHA_S3_BUCKET,
# KOSHA_S3_PREFIX, AWS_DEFAULT_REGION) are injected at deploy time from
# GitHub Environment secrets — never committed as customer-specific values.
apiVersion: v1
kind: ConfigMap
metadata:
  name: kosha-config
  namespace: kosha
data:
  # KOSHA_ROLE is intentionally NOT set here — it differs per Deployment
  # (ingest vs query) and is set explicitly at the container level in
  # deployment.yaml / deployment-query.yaml instead, where an explicit `env`
  # entry overrides this shared envFrom. Setting it here would silently
  # apply to both and require every reader to know the override exists.
  KOSHA_HTTP_PORT: "8080"
  KOSHA_DATA_DIR: /var/cache/kosha/data
  KOSHA_CACHE_DIR: /var/cache/kosha
  # S3 server-side encryption (#343). Unset = `none`: no SSE header, the
  # bucket's default encryption applies. The IRSA role needs
  # kms:Decrypt + kms:GenerateDataKey on every key named here (see
  # k8s/README.md, "Encryption at rest"). An invalid value stops the pod at
  # startup rather than writing unencrypted objects.
  # KOSHA_S3_SSE: "aws:kms"
  # KOSHA_S3_SSE_KMS_KEY_ID: arn:aws:kms:us-east-1:111122223333:key/DEFAULT-KEY-ID
  # KOSHA_S3_SSE_BUCKET_KEY: "true"
  # Per-tenant keys (BYOK); a tenant not listed uses the default key.
  # KOSHA_S3_TENANT_KMS_KEYS: acme=arn:aws:kms:us-east-1:111122223333:key/ACME-KEY-ID
  # ...or the same map as JSON from a mounted file:
  # KOSHA_S3_TENANT_KMS_KEYS_FILE: /etc/kosha/tenant-kms-keys.json

# No IRSA annotation yet (S3/infra wiring is a fast-follow, tracked
# separately). kosha-server runs local-disk-only until KOSHA_S3_BUCKET is
# set, so this ServiceAccount is safe to create ahead of that work — add
# `eks.amazonaws.com/role-arn` here once the IRSA role exists.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kosha
  namespace: kosha
